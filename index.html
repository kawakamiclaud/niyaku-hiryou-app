// ================================================================
// Phase E(在庫・入出庫履歴・ロット・在庫引当): 在庫タブ
// 在庫数量は直接編集可能なフィールードとして持たず、常にinventoryMovements(入出庫履歴)の積み上げ
// から算出する(stockOnHand/currentLotQtyが唯一の算出方法)。過去の入出庫履歴は編集・物理削除せず、
// 取消(cancelledフラグ)のみで在庫集計から除外する。
// ================================================================
function InventoryTab({data,update}){
  const [subTab,setSubTab] = useState("summary"); // summary / movements / lots / warehouses
  const subTabs = [["summary","在庫サマリー"],["movements","入出庫履歴・新規登録"],["lots","ロット管理"],["warehouses","倉庫マスタ"]];
  return (
    <div className="card">
      <div className="flex-between" style={{marginBottom:12}}>
        <h2 style={{border:"none",padding:0}}>在庫</h2>
        <div className="flex">
          {subTabs.map(([k,label])=>(
            <button key={k} className={"btn btn-sm "+(subTab===k?"btn-primary":"btn-secondary")} onClick={()=>setSubTab(k)}>{label}</button>
          ))}
        </div>
      </div>
      {subTab==="summary" && <StockSummarySection data={data}/>}
      {subTab==="movements" && <MovementSection data={data} update={update}/>}
      {subTab==="lots" && <LotSection data={data} update={update}/>}
      {subTab==="warehouses" && <WarehouseSection data={data} update={update}/>}
    </div>
  );
}

// ---- 在庫サマリー: 商品×倉庫ごとの現在庫/引当済み/使用可能在庫。全てstockOnHand/allocatedQtyForから算出する。
function StockSummarySection({data}){
  const [productFilter,setProductFilter] = useState("");
  const [warehouseFilter,setWarehouseFilter] = useState("");
  const [hideZero,setHideZero] = useState(true);
  const products = (data.products||[]).filter(p=>p.active!==false && (!productFilter || p.id===productFilter));
  const warehouses = (data.warehouses||[]).filter(w=>w.active!==false && (!warehouseFilter || w.id===warehouseFilter));
  const rows = [];
  products.forEach(p=>{
    warehouses.forEach(w=>{
      const onHand = stockOnHand(data.inventoryMovements, p.id, w.id, null);
      const allocated = allocatedQtyFor(data, p.id, w.id, null);
      const available = onHand - allocated;
      if (hideZero && onHand===0 && allocated===0) return;
      let expiredQty = 0, expiringQty = 0;
      if (p.lotManaged) {
        (data.lots||[]).filter(l=>l.productId===p.id && l.warehouseId===w.id).forEach(l=>{
          const st = computeLotStatus(l, today(), data.meta?.lotExpiryThresholdDays ?? 30);
          const q = currentLotQty(data.inventoryMovements, l.id);
          if (st==="expired") expiredQty += q;
          else if (st==="expiring_soon") expiringQty += q;
        });
      }
      rows.push({product:p, warehouse:w, onHand, allocated, available, expiredQty, expiringQty});
    });
  });
  return (
    <div>
      <div className="flex" style={{marginBottom:10}}>
        <select value={productFilter} onChange={e=>setProductFilter(e.target.value)}>
          <option value="">全商品</option>
          {(data.products||[]).filter(p=>p.active!==false).map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
        </select>
        <select value={warehouseFilter} onChange={e=>setWarehouseFilter(e.target.value)}>
          <option value="">全倉庫</option>
          {(data.warehouses||[]).filter(w=>w.active!==false).map(w=><option key={w.id} value={w.id}>{w.name}</option>)}
        </select>
        <label style={{display:"inline-flex",alignItems:"center",gap:4,fontSize:11}}>
          <input type="checkbox" style={{width:"auto"}} checked={hideZero} onChange={e=>setHideZero(e.target.checked)}/>
          在庫・引当が両方0の行を隠す
        </label>
      </div>
      <table>
        <thead><tr>
          <th>商品</th><th>倉庫</th><th className="text-right">現在庫</th><th className="text-right">引当済み在庫</th>
          <th className="text-right">使用可能在庫</th><th className="text-right">発注残</th><th className="text-right">入荷予定/出荷予定</th>
          <th className="text-right">期限切れ数量</th><th className="text-right">期限間近数量</th>
        </tr></thead>
        <tbody>
          {rows.map((r,i)=>(
            <tr key={i}>
              <td>{r.product.name}</td><td>{r.warehouse.name}</td>
              <td className="text-right">{r.onHand}</td>
              <td className="text-right">{r.allocated}</td>
              <td className="text-right" style={{fontWeight:"bold",color:r.available<0?"#DC3545":"#1F4E79"}}>{r.available}</td>
              <td className="text-right">-</td>
              <td className="text-right">-</td>
              <td className="text-right" style={{color:r.expiredQty>0?"#DC3545":undefined}}>{r.product.lotManaged?r.expiredQty:"-"}</td>
              <td className="text-right" style={{color:r.expiringQty>0?"#B45309":undefined}}>{r.product.lotManaged?r.expiringQty:"-"}</td>
            </tr>
          ))}
          {rows.length===0 && <tr><td colSpan={9} style={{textAlign:"center",color:"#999"}}>該当データがありません</td></tr>}
        </tbody>
      </table>
    </div>
  );
}

// ---- 入出庫履歴の新規登録フォーム + 履歴一覧(フィルタ可) ----
function MovementSection({data,update}){
  const blankForm = {productId:"",warehouseId:"",toWarehouseId:"",movementType:"purchase_in",lotId:"",newLot:false,lotNo:"",expiryDate:"",manufacturedDate:"",supplierId:"",receivedDate:today(),inQty:"",outQty:"",qty:"",reason:""};
  const [form,setForm] = useState({...blankForm});
  const set = (k,v) => setForm(prev=>({...prev,[k]:v}));
  const product = data.products.find(p=>p.id===form.productId);
  const lotsHere = product ? (data.lots||[]).filter(l=>l.productId===product.id && l.warehouseId===form.warehouseId) : [];
  const suppliers = data.partners.filter(p=>p.type==="supplier");

  // フィルタ(履歴一覧側)
  const [fProduct,setFProduct] = useState("");
  const [fWarehouse,setFWarehouse] = useState("");
  const [fType,setFType] = useState("");
  const [fFrom,setFFrom] = useState("");
  const [fTo,setFTo] = useState("");

  const resetForm = () => setForm({...blankForm});

  const submit = () => {
    if (!product) { alert("商品を選択してください。"); return; }
    if (!form.warehouseId) { alert("倉庫を選択してください。"); return; }
    if (form.movementType==="transfer") {
      if (!form.toWarehouseId) { alert("移動先倉庫を選択してください。"); return; }
      if (form.toWarehouseId===form.warehouseId) { alert("移動元と移動先が同じ倉庫です。"); return; }
      const q = Number(form.qty);
      if (!q || q<=0) { alert("移動数量を入力してください。"); return; }
      let lotId = form.lotId || null;
      if (product.lotManaged && !lotId) { alert("この商品はロット管理対象です。ロットを選択してください。"); return; }
      if (lotId) {
        const lot = data.lots.find(l=>l.id===lotId);
        const st = computeLotStatus(lot, today(), data.meta?.lotExpiryThresholdDays ?? 30);
        if (st==="expired") { alert("このロットは期限切れのため倉庫間移動(出庫)できません。"); return; }
      }
      update(d=>{
        d.inventoryMovements = d.inventoryMovements || [];
        const now = new Date().toISOString();
        const trg = newId("trg");
        const outRec = {id:newId("mv"),timestamp:now,productId:product.id,warehouseId:form.warehouseId,lotId,inQty:0,outQty:q,unit:product.unit,
          sourceTransactionId:null,sourceShipmentId:null,sourcePurchaseId:null,movementType:"transfer",reason:form.reason||"",transferGroupId:trg,
          createdBy:d.meta?.currentUserName||"",createdAt:now,cancelled:false,cancelReason:null};
        const inRec = {...outRec,id:newId("mv"),warehouseId:form.toWarehouseId,inQty:q,outQty:0};
        d.inventoryMovements = [...d.inventoryMovements, outRec, inRec];
        d = addAuditLog(d,{action:"stock_out",targetType:"inventoryMovement",targetId:outRec.id,before:null,after:outRec,reason:`倉庫間移動(${form.reason||""})`});
        d = addAuditLog(d,{action:"stock_in",targetType:"inventoryMovement",targetId:inRec.id,before:null,after:inRec,reason:`倉庫間移動(${form.reason||""})`});
        return d;
      });
      resetForm();
      return;
    }
    const inQ = Number(form.inQty)||0, outQ = Number(form.outQty)||0;
    if (inQ>0 && outQ>0) { alert("入庫数量と出庫数量の両方を入力することはできません。どちらか一方のみ入力してください。"); return; }
    if (inQ<=0 && outQ<=0) { alert("入庫数量または出庫数量のいずれかを入力してください。"); return; }
    let lotId = form.lotId || null;
    if (product.lotManaged) {
      if (form.newLot) {
        if (!form.lotNo.trim()) { alert("新規ロット番号を入力してください。"); return; }
      } else if (!lotId) { alert("この商品はロット管理対象です。既存ロットを選択するか、新規ロットとして登録してください。"); return; }
    }
    if (outQ>0 && OUTBOUND_MOVEMENT_TYPES.includes(form.movementType) && lotId) {
      const lot = data.lots.find(l=>l.id===lotId);
      const st = computeLotStatus(lot, today(), data.meta?.lotExpiryThresholdDays ?? 30);
      if (st==="expired") { alert("このロットは期限切れのため出庫できません。"); return; }
    }
    update(d=>{
      d.inventoryMovements = d.inventoryMovements || [];
      d.lots = d.lots || [];
      const now = new Date().toISOString();
      let useLotId = lotId;
      if (product.lotManaged && form.newLot) {
        const lotRec = {id:newId("lot"), lotNo:form.lotNo.trim(), productId:product.id, supplierId:form.supplierId||null,
          receivedDate:form.receivedDate||today(), manufacturedDate:form.manufacturedDate||null, expiryDate:form.expiryDate||null,
          warehouseId:form.warehouseId, receivedQty:inQ, status:"available", note:""};
        d.lots = [...d.lots, lotRec];
        d = addAuditLog(d,{action:"create",targetType:"lot",targetId:lotRec.id,before:null,after:lotRec,reason:"入出庫登録時の新規ロット作成"});
        useLotId = lotRec.id;
      }
      const rec = {id:newId("mv"), timestamp:now, productId:product.id, warehouseId:form.warehouseId, lotId:useLotId,
        inQty:inQ, outQty:outQ, unit:product.unit, sourceTransactionId:null, sourceShipmentId:null, sourcePurchaseId:null,
        movementType:form.movementType, reason:form.reason||"", createdBy:d.meta?.currentUserName||"", createdAt:now,
        cancelled:false, cancelReason:null};
      d.inventoryMovements = [...d.inventoryMovements, rec];
      const auditAction = inQ>0 ? "stock_in" : (["stocktake_increase","stocktake_decrease","other_adjust"].includes(form.movementType) ? "stock_adjust" : "stock_out");
      d = addAuditLog(d, {action:auditAction, targetType:"inventoryMovement", targetId:rec.id, before:null, after:rec, reason:form.reason||""});
      return d;
    });
    resetForm();
  };

  const cancelMovement = (m) => {
    const reason = prompt("取消理由を入力してください(この入出庫履歴は削除せず、取消として記録に残ります)");
    if (reason===null) return;
    update(d=>{
      const before = (d.inventoryMovements||[]).find(x=>x.id===m.id);
      d.inventoryMovements = (d.inventoryMovements||[]).map(x=>x.id===m.id?{...x,cancelled:true,cancelReason:reason}:x);
      const after = d.inventoryMovements.find(x=>x.id===m.id);
      d = addAuditLog(d, {action:"stock_adjust", targetType:"inventoryMovement", targetId:m.id, before, after, reason:`入出庫履歴取消: ${reason}`});
      return d;
    });
  };

  let history = [...(data.inventoryMovements||[])].sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||""));
  if (fProduct) history = history.filter(m=>m.productId===fProduct);
  if (fWarehouse) history = history.filter(m=>m.warehouseId===fWarehouse);
  if (fType) history = history.filter(m=>m.movementType===fType);
  if (fFrom) history = history.filter(m=>(m.createdAt||"")>=fFrom);
  if (fTo) history = history.filter(m=>(m.createdAt||"")<=fTo+"T23:59:59");

  return (
    <div>
      <div className="card" style={{background:"#F9FAFB",marginBottom:14}}>
        <h2 style={{fontSize:13}}>入出庫の新規登録</h2>
        <div className="grid-3">
          <div className="form-row"><label>商品 *</label>
            <select value={form.productId} onChange={e=>set("productId",e.target.value)}>
              <option value="">選択...</option>
              {(data.products||[]).filter(p=>p.active!==false).map(p=><option key={p.id} value={p.id}>{p.name}{p.lotManaged?" [ロット管理]":""}</option>)}
            </select>
          </div>
          <div className="form-row"><label>{form.movementType==="transfer"?"移動元倉庫 *":"倉庫 *"}</label>
            <select value={form.warehouseId} onChange={e=>set("warehouseId",e.target.value)}>
              <option value="">選択...</option>
              {(data.warehouses||[]).filter(w=>w.active!==false).map(w=><option key={w.id} value={w.id}>{w.name}</option>)}
            </select>
          </div>
          <div className="form-row"><label>移動区分 *</label>
            <select value={form.movementType} onChange={e=>set("movementType",e.target.value)}>
              {Object.keys(MOVEMENT_TYPE_LABELS).map(k=><option key={k} value={k}>{MOVEMENT_TYPE_LABELS[k]}</option>)}
            </select>
          </div>
        </div>
        {form.movementType==="transfer" ? (
          <div className="grid-3">
            <div className="form-row"><label>移動先倉庫 *</label>
              <select value={form.toWarehouseId} onChange={e=>set("toWarehouseId",e.target.value)}>
                <option value="">選択...</option>
                {(data.warehouses||[]).filter(w=>w.active!==false && w.id!==form.warehouseId).map(w=><option key={w.id} value={w.id}>{w.name}</option>)}
              </select>
            </div>
            <div className="form-row"><label>移動数量 *</label><input type="number" step="0.01" value={form.qty} onChange={e=>set("qty",e.target.value)}/></div>

    if (!w.name || !w.name.trim()) { alert("倉庫名は必須です。"); return; }

      d.warehouses = d.warehouses || [];

      else { w.id = newId("wh"); d.warehouses = [...d.warehouses, w]; }
      d = addAuditLog(d, {action: before?"update":"create", targetType:"warehouse", targetId:w.id, before, after:w});
      return d;

    <div>

// 入金・消込 / 売掛金一覧(AR aging) — Phase F
// ================================================================
const PAYMENT_METHOD_LABELS = {
  bank_transfer: "銀行振込",
  cash: "現金",
  account_debit: "口座振替",
  offset: "相殺",
  promissory_note: "手形",
  other: "その他",
};
const PAYMENT_STATUS_LABELS = {
  unpaid: "未入金",
  partial: "一部入金",
  paid: "入金済み",
  overpaid: "過入金",
  overdue: "支払期限超過",
  cancelled: "取消済み",
};

// ---- 請求発行日: freee送信時(InvoicingTab.doFreeeIssue)と全く同じロジック(対象月の月末)で算出する。
// invoices[]レコード自体には発行日を独立フィールドとして持たせていないため、targetMonthから逆算する。
function invoiceIssueDate(inv) {
  if (!inv || !inv.targetMonth) return null;
  const d = new Date(inv.targetMonth+"-01");
  d.setMonth(d.getMonth()+1);
  d.setDate(0);
  return d.toISOString().slice(0,10);
}

// ---- 指定請求へ配分された入金額(有効=取消されていない入金の消込額のみを合算。銀行手数料按分は含まない生の配分額) ----
function invoiceAllocatedAmount(invoiceId, payments) {
  let s = 0;
  (payments||[]).forEach(p=>{
    if (p.cancelled) return;
    (p.allocations||[]).forEach(a=>{ if (a.invoiceId===invoiceId) s += Number(a.amount||0); });
  });
  return s;
}

// ---- 請求残高 = 請求額 − 有効な消込額 − 許容された手数料差引額 ----
// 銀行手数料按分方針(仕様の「按分」案を採用): 振込手数料が差し引かれて着金した入金(payment.bankFee)は、
// その入金が実際に割り当てた請求(allocations)へ、配分額の比率で按分して負担させる。単一請求のみへの配分なら
// その請求が手数料を全額吸収し、複数請求に配分している場合は金額比で分割する。「最後の割当に寄せる」方式は、
// どの割当が「最後」かがUI操作順に依存し挙動が不安定になるため採用しなかった。
function computeInvoiceOutstanding(invoice, payments) {
  const total = Number(invoice?.total || 0);
  let consumed = 0;
  (payments||[]).forEach(p=>{
    if (p.cancelled) return;
    const allocs = p.allocations || [];
    const allocSum = allocs.reduce((s,a)=>s+Number(a.amount||0),0);
    const bf = Number(p.bankFee||0);
    allocs.forEach(a=>{
      if (a.invoiceId !== invoice.id) return;
      const feeShare = allocSum>0 ? bf * (Number(a.amount||0)/allocSum) : 0;
      consumed += Number(a.amount||0) + feeShare;
    });
  });
  return total - consumed;
}

// ---- 入金ステータス自動判定 ----
// dueDateStrは呼び出し側でcalcDueDate(customer, invoiceIssueDate(invoice))を使って算出した値を渡す
// (この関数自体を取引先マスタの取得ロジックに依存させず、日付文字列比較のみを行う純粋関数として保つため、
// 仕様の3引数(invoice, payments, today)に加えdueDateStrを第4引数として追加している)。
// 優先順位: 取消済み(取引自体がキャンセル) > 過入金 > 入金済み > 支払期限超過 > 未入金/一部入金
function computePaymentStatus(invoice, payments, todayStr, dueDateStr) {
  if (!invoice) return "unpaid";
  if (invoice.status === "cancelled") return "cancelled";
  const balance = computeInvoiceOutstanding(invoice, payments);
  if (balance < 0) return "overpaid";
  if (balance <= 0) return "paid";
  if (dueDateStr && todayStr && todayStr > dueDateStr) return "overdue";
  const allocated = invoiceAllocatedAmount(invoice.id, payments);
  if (allocated <= 0) return "unpaid";
  return "partial";
}

// ---- 入金レコード自体の未消込額(入金額のうち、まだどの請求にも割り当てられていない残り) ----
function paymentUnreconciledAmount(payment) {
  const allocSum = (payment.allocations||[]).reduce((s,a)=>s+Number(a.amount||0),0);
  return Number(payment.amount||0) - allocSum;
}

function PaymentStatusBadge({status}){

    overpaid: {background:"#F3D9FA",color:"#7B2CBF"},
    overdue: {background:"#FCE4D6",color:"#DC3545"},
    cancelled: {background:"#EEE",color:"#666"},
  };
  return <span className="badge" style={styles[status]||styles.unpaid}>{PAYMENT_STATUS_LABELS[status]||status}</span>;
}

          <div className="form-row"><label>入金方法</label>
            <select value={form.paymentMethod} onChange={e=>set("paymentMethod",e.target.value)}>

            <p style={{fontSize:11,marginBottom:6}}>この入金額のうち、どの請求にいくら消込むかを入力してください(1件でも複数件でも可。未入力分は「未消込」として保持されます)。</p>

                <thead><tr><th>請求No.</th><th>請求日</th><th className="text-right">請求額</th><th className="text-right">現在残高</th><th>状態</th><th className="text-right">消込額</th></tr></thead>
                <tbody>
                  {outstandingInvoices.map(inv=>{
                    const bal = computeInvoiceOutstanding(inv, data.payments);
                    const cust = data.partners.find(p=>p.id===inv.customerId);
                    const due = calcDueDate(cust, invoiceIssueDate(inv));
                    const st = computePaymentStatus(inv, data.payments, today(), due);
                    return <tr key={inv.id}>
                      <td>{inv.invoiceNo}</td>
                      <td>{fmtDate(invoiceIssueDate(inv))}</td>
                      <td className="text-right price">{yen(inv.total)}</td>

// ---- 消込取消/編集モーダル: 入金レコード自体は取消さず、allocations配列のみを編集する(通常の編集保存として実装) ----
function PaymentEditModal({payment,data,update,onClose}){
  const [allocMap,setAllocMap] = useState(()=>{
    const m = {};
    (payment.allocations||[]).forEach(a=>{ m[a.invoiceId] = String(a.amount); });
    return m;
  });
  const [reason,setReason] = useState("");
  const customerInvoices = (data.invoices||[]).filter(inv=>inv.customerId===payment.customerId && inv.status!=="cancelled");
  // この入金自身の既存配分を除いた「他の入金による」残高を参考表示するための仮データ(保存はしない)
  const otherPayments = (data.payments||[]).map(p=> p.id===payment.id ? {...p, allocations:[]} : p);

  const save = () => {
    if (!reason.trim()) { alert("変更理由を入力してください。"); return; }
    const allocations = Object.keys(allocMap)
      .filter(iid=>Number(allocMap[iid])>0)
      .map(iid=>{
        const existing = (payment.allocations||[]).find(a=>a.invoiceId===iid);
        return {id: existing?.id || newId("pal"), invoiceId: iid, amount: Number(allocMap[iid])};
      });
    const allocSum = allocations.reduce((s,a)=>s+a.amount,0);
    if (allocSum > Number(payment.amount||0)) { alert(`割当合計(${yen(allocSum)})が入金額(${yen(payment.amount)})を超えています。`); return; }
    update(d=>{
      const before = (d.payments||[]).find(x=>x.id===payment.id);
      if (!before) { alert("入金レコードが見つかりません。"); return d; }
      const after = {...before, allocations};
      d.payments = d.payments.map(x=>x.id===payment.id?after:x);
      d = addAuditLog(d, {action:"payment_update", targetType:"payment", targetId:payment.id, before, after, reason});
      return d;
    });
    onClose();
  };

  return (
    <div className="modal-bg" onClick={onClose}>
      <div className="modal" style={{width:680}} onClick={e=>e.stopPropagation()}>
        <h3>消込内容の変更 ({fmtDate(payment.paymentDate)} / {yen(payment.amount)})</h3>
        <p style={{fontSize:12,color:"#666",marginBottom:10}}>
          この入金の請求への割当を編集します(金額を0または空欄にすると「消込取消」になります)。入金そのものを取消す場合は一覧の「取消」ボタンを使ってください。
        </p>
        <table>
          <thead><tr><th>請求No.</th><th className="text-right">請求額</th><th className="text-right">この入金以外での残高</th><th className="text-right">この入金からの割当額</th></tr></thead>
          <tbody>
            {customerInvoices.map(inv=>{
              const bal = computeInvoiceOutstanding(inv, otherPayments);
              return <tr key={inv.id}>
                <td>{inv.invoiceNo}</td>
                <td className="text-right price">{yen(inv.total)}</td>
                <td className="text-right">{yen(bal)}</td>
                <td><input type="number" style={{width:110}} value={allocMap[inv.id]||""} onChange={e=>setAllocMap({...allocMap,[inv.id]:e.target.value})}/></td>
              </tr>;
            })}
            {customerInvoices.length===0 && <tr><td colSpan={4} style={{textAlign:"center",color:"#999"}}>この販売先の請求(取消以外)がありません</td></tr>}
          </tbody>
        </table>
        <div className="form-row" style={{marginTop:10}}><label>変更理由 *</label><input value={reason} onChange={e=>setReason(e.target.value)}/></div>
        <div className="flex" style={{justifyContent:"flex-end",marginTop:12}}>
          <button className="btn btn-secondary" onClick={onClose}>キャンセル</button>
          <button className="btn btn-primary" onClick={save}>保存</button>
        </div>
      </div>
    </div>
  );
}

// ---- 売掛金一覧(AR aging) ----
function ARAgingSection({data}){
  const customers = data.partners.filter(p=>p.type==="customer");
  const [fCustomer,setFCustomer] = useState("");
  const [fDueFrom,setFDueFrom] = useState("");
  const [fDueTo,setFDueTo] = useState("");
  const [fStatus,setFStatus] = useState(""); // ""/unpaid/partial/paid/overdue

  const todayStr = today();
  const rows = useMemo(()=>{
    return (data.invoices||[]).filter(inv=>inv.status!=="cancelled").map(inv=>{
      const cust = data.partners.find(p=>p.id===inv.customerId);
      const issueDate = invoiceIssueDate(inv);
      const dueDate = calcDueDate(cust, issueDate);
      const status = computePaymentStatus(inv, data.payments, todayStr, dueDate);
      const paidAmount = invoiceAllocatedAmount(inv.id, data.payments);
      const balance = computeInvoiceOutstanding(inv, data.payments);
      const overdueDays = (status==="overdue" && dueDate) ? Math.floor((new Date(todayStr)-new Date(dueDate))/(1000*60*60*24)) : null;
      return {inv, cust, issueDate, dueDate, status, paidAmount, balance, overdueDays};
    });
  },[data.invoices, data.payments, data.partners]);

  let filtered = rows;
  if (fCustomer) filtered = filtered.filter(r=>r.inv.customerId===fCustomer);
  if (fDueFrom) filtered = filtered.filter(r=>(r.dueDate||"")>=fDueFrom);
  if (fDueTo) filtered = filtered.filter(r=>(r.dueDate||"")<=fDueTo);
  if (fStatus) filtered = filtered.filter(r=>r.status===fStatus);
  filtered = [...filtered].sort((a,b)=>(a.dueDate||"").localeCompare(b.dueDate||""));

  // ---- 取引先ごとの売掛金残高集計: 非取消かつ残高>0(=未入金/一部入金/期限超過。過入金はマイナスなので除外)の合算 ----
  const byCustomer = {};
  rows.forEach(r=>{
    if (r.balance > 0) byCustomer[r.inv.customerId] = (byCustomer[r.inv.customerId]||0) + r.balance;

  const statusButtons = [["","全て"],["unpaid","未入金"],["partial","一部入金"],["paid","入金済み"],["overdue","期限超過"]];

  return (
    <div>
      <h2 style={{fontSize:13}}>取引先ごとの売掛金残高</h2>
      <table style={{marginBottom:16}}>
        <thead><tr><th>取引先</th><th className="text-right">売掛金残高合計</th></tr></thead>
        <tbody>
          {Object.keys(byCustomer).length===0 && <tr><td colSpan={2} style={{textAlign:"center",color:"#999"}}>残高のある取引先はありません</td></tr>}
          {Object.keys(byCustomer).sort((a,b)=>byCustomer[b]-byCustomer[a]).map(id=>{
            const c = data.partners.find(p=>p.id===id);
            return <tr key={id}><td>{c?.name||id}</td><td className="text-right price">{yen(byCustomer[id])}</td></tr>;
          })}
        </tbody>
      </table>

      <h2 style={{fontSize:13}}>請求書ごとの売掛金一覧</h2>
      <div className="flex" style={{marginBottom:8,flexWrap:"wrap"}}>
        <select value={fCustomer} onChange={e=>setFCustomer(e.target.value)}>
          <option value="">全取引先</option>
          {customers.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
        </select>
        <label style={{fontSize:11,display:"flex",alignItems:"center"}}>支払期限:</label>
        <input type="date" value={fDueFrom} onChange={e=>setFDueFrom(e.target.value)}/>〜
        <input type="date" value={fDueTo} onChange={e=>setFDueTo(e.target.value)}/>
        {statusButtons.map(([k,label])=>(
          <button key={k} className={"btn btn-sm "+(fStatus===k?"btn-primary":"btn-secondary")} onClick={()=>setFStatus(k)}>{label}</button>
        ))}
      </div>
      <table>
        <thead><tr>
          <th>請求先</th><th>請求番号</th><th>請求日</th><th>支払期限</th>
          <th className="text-right">請求額</th><th className="text-right">入金額</th><th className="text-right">残高</th>
          <th className="text-right">経過日数</th><th>状態</th>
        </tr></thead>
        <tbody>
          {filtered.map(r=>(
            <tr key={r.inv.id}>
              <td>{r.cust?.name||"-"}</td>
              <td>{r.inv.invoiceNo}</td>
              <td>{fmtDate(r.issueDate)}</td>
              <td>{fmtDate(r.dueDate)}</td>
              <td className="text-right price">{yen(r.inv.total)}</td>

function PricesTab({data,update}){
  const [filterPart,setFilterPart] = useState("");
  const [filterProd,setFilterProd] = useState("");
  const [editing,setEditing] = useState(null);
  let list = data.prices || [];
  if (filterPart) list = list.filter(p=>p.partnerId===filterPart);
  if (filterProd) list = list.filter(p=>p.productId===filterProd);
  const save = p => {
    const errors = [];
    if (!p.partnerId) errors.push("取引先は必須です");
    if (!p.productId) errors.push("商品は必須です");
    if (!p.startDate) errors.push("適用開始日は必須です");
    if (Number(p.unitPrice) < 0) errors.push("単価にマイナスは入力できません");
    if (p.partnerId && p.productId && p.startDate) {
      const overlap = findOverlappingPrice(data.prices||[], p);
      if (overlap) {
        const pt = data.partners.find(x=>x.id===p.partnerId);
        const pd = data.products.find(x=>x.id===p.productId);
        errors.push(`同一条件(${pt?.name||""}/${pd?.name||""}/${p.sanchi}/${p.priceType==="sale"?"販売":"仕入"})で適用期間が重複する単価が既に存在します(${fmtDate(overlap.startDate)}〜${overlap.endDate?fmtDate(overlap.endDate):"無期限"})`);
      }
    }
    if (errors.length) { alert("入力エラー:\n・"+errors.join("\n・")); return; }
    update(d=>{
      d.prices=d.prices||[];
      const before = p.id ? d.prices.find(x=>x.id===p.id) : null;
      if(p.id)d.prices=d.prices.map(x=>x.id===p.id?p:x);else{p.id=newId("price");d.prices.push(p);}
      d = addAuditLog(d, {action: before?"update":"create", targetType:"price", targetId:p.id, before, after:p});
      return d;
    });
    setEditing(null);
  };
  const del = id => {
    // 単価は取引にIDで直接紐づかない(値をコピーして使う)ため常に物理削除可
    if(!confirm("削除?"))return;
    const before = data.prices.find(x=>x.id===id);
    update(d=>{
      d = addAuditLog(d, {action:"delete", targetType:"price", targetId:id, before, after:null});
      d.prices=d.prices.filter(p=>p.id!==id);
      return d;
    });
  };

// ================================================================
// 見積(quotations) タブ ※取引・請求・ダッシュボードの集計には一切含めない、独立したデータ
// ================================================================
const QUOTATION_STATUS_LABEL = {
  draft:"下書き", submitted:"提出済み", approved:"承認", ordered:"受注",
  lost:"失注", expired:"期限切れ", cancelled:"取消"
};

function QuotationsTab({data,update}){
  const [editing,setEditing] = useState(null);
  const [printDoc,setPrintDoc] = useState(null);
  const [filterCustomer,setFilterCustomer] = useState("");
  const [filterStatus,setFilterStatus] = useState("all");
  const [filterFrom,setFilterFrom] = useState("");
  const [filterTo,setFilterTo] = useState("");

  let list = (data.quotations||[]).slice().sort((a,b)=>(b.quotationDate||"").localeCompare(a.quotationDate||""));
  if (filterCustomer) list = list.filter(q=>q.customerId===filterCustomer);
  if (filterStatus!=="all") list = list.filter(q=>q.status===filterStatus);
  if (filterFrom) list = list.filter(q=>q.quotationDate && q.quotationDate>=filterFrom);
  if (filterTo) list = list.filter(q=>q.quotationDate && q.quotationDate<=filterTo);

  const save = (q) => {
    const errors = validateQuotation(q);
    if (errors.length) { alert("入力エラー:\n・"+errors.join("\n・")); return; }
    const isNew = !q.id;
    update(d=>{
      d.quotations = d.quotations || [];
      let before = null;
      const now = new Date().toISOString();
      let after;
      if (q.id) {
        before = d.quotations.find(x=>x.id===q.id) || null;
        after = {...q, updatedAt:now, updatedBy: d.meta?.currentUserName||""};
        d.quotations = d.quotations.map(x=>x.id===q.id?after:x);
      } else {
        after = {...q, id:newId("quo"), quotationNo: genQuotationNo(d.quotations, q.quotationDate),
          createdAt:now, updatedAt:now, createdBy:d.meta?.currentUserName||"", updatedBy:d.meta?.currentUserName||"",
          convertedTransactionId:null, convertedAt:null, convertedBy:null};
        d.quotations = [...d.quotations, after];
      }
      // 提出済み以降のステータスで内容を変更した場合は、通常のupdateログに加えて
      // 「提出後の変更」であることが分かる専用actionでも記録し、追跡できるようにする。
      const postSubmit = before && ["submitted","approved","ordered","lost","expired"].includes(before.status);
      d = addAuditLog(d, {action: isNew?"create":"update", targetType:"quotation", targetId:after.id, before, after});
      if (postSubmit) {
        d = addAuditLog(d, {action:"quotation_update_after_submit", targetType:"quotation", targetId:after.id, before, after, reason:"提出後の内容変更"});
      }
      return d;
    });
    setEditing(null);
  };

  const del = (id) => {
    const q = (data.quotations||[]).find(x=>x.id===id);
    if (!q) return;
    if (q.convertedTransactionId) { alert("この見積は既に受注登録済みのため削除できません。"); return; }
    if (!confirm("見積を削除します。よろしいですか？")) return;
    update(d=>{
      d = addAuditLog(d, {action:"delete", targetType:"quotation", targetId:id, before:q, after:null});
      d.quotations = (d.quotations||[]).filter(x=>x.id!==id);
      return d;
    });
  };

  // ---- 見積書の印刷/PDF: 既に発行済み(未取消)の帳票があればそれをそのまま開き(内容凍結)、
  // 無ければ現時点の見積内容でスナップショットを作成してdocuments[]に登録してから開く。 ----
  const handlePrint = (q) => {
    const {doc, isNew} = prepareDocument(data, {
      documentType:"quotation", sourceId: q.id, documentNo: q.quotationNo,
      buildSnapshot: () => buildQuotationSnapshot(q, data),
    });
    if (isNew) update(d => commitDocumentIssue(d, doc, `見積${q.quotationNo}`));
    setPrintDoc(doc);
  };

  return (
    <div className="card">
      <div className="flex-between" style={{marginBottom:12}}>
        <h2 style={{border:"none",padding:0}}>見積 ({list.length}件)</h2>
        <button className="btn btn-primary" onClick={()=>setEditing({quotationDate:today(),expiryDate:"",sanchi:"熊本",items:[],status:"draft"})}>＋ 新規見積</button>
      </div>
      <div className="flex" style={{marginBottom:12}}>
        <select value={filterCustomer} onChange={e=>setFilterCustomer(e.target.value)}>
          <option value="">全ての販売先</option>
          {data.partners.filter(p=>p.type==="customer").map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
        </select>
        <select value={filterStatus} onChange={e=>setFilterStatus(e.target.value)}>
          <option value="all">全ステータス</option>
          {Object.keys(QUOTATION_STATUS_LABEL).map(k=><option key={k} value={k}>{QUOTATION_STATUS_LABEL[k]}</option>)}
        </select>
        <label style={{fontSize:11}}>期間:</label>
        <input type="date" value={filterFrom} onChange={e=>setFilterFrom(e.target.value)}/>
        <span>〜</span>
        <input type="date" value={filterTo} onChange={e=>setFilterTo(e.target.value)}/>
      </div>
      <p style={{fontSize:11,color:"#666",marginBottom:8}}>💡 見積は取引・請求・ダッシュボードの集計には一切含まれません。「この見積から受注登録」を押すと取引タブに新規取引として反映されます。</p>
      <table>
        <thead><tr>
          <th>見積No.</th><th>見積日</th><th>販売先</th><th>品目</th>
          <th className="text-right">税込合計</th><th>状態</th><th></th>
        </tr></thead>
        <tbody>
          {list.map(q=>{
            const c = data.partners.find(p=>p.id===q.customerId);
            const totals = computeQuotationTotals(q, data.products);
            return <tr key={q.id}>
              <td>{q.quotationNo}</td>
              <td>{fmtDate(q.quotationDate)}</td>
              <td>{c?.name||"-"}</td>
              <td style={{fontSize:11}}>{itemSummary(q.items, data.products)}</td>
              <td className="text-right price">{yen(totals.taxIncludedTotal)}</td>
              <td><span className={"badge "+(q.status==="ordered"?"badge-invoiced":q.status==="draft"?"badge-created":"badge-hiryou")}>{QUOTATION_STATUS_LABEL[q.status]||q.status}</span></td>
              <td>
                <button className="btn btn-secondary btn-sm" onClick={()=>setEditing(q)}>{q.status==="ordered"?"表示":"編集"}</button>
                <button className="btn btn-secondary btn-sm" style={{marginLeft:4}} onClick={()=>handlePrint(q)}>印刷/PDF</button>
                {!q.convertedTransactionId && <button className="btn btn-danger btn-sm" style={{marginLeft:4}} onClick={()=>del(q.id)}>削除</button>}
              </td>
            </tr>;
          })}
        </tbody>
      </table>
      {editing && <QuotationModal record={editing} data={data} update={update} onSave={save} onClose={()=>setEditing(null)}/>}
      {printDoc && <DocumentPrintView doc={printDoc} update={update} onClose={()=>setPrintDoc(null)}/>}
    </div>
  );
}

function QuotationModal({record,data,update,onSave,onClose}){
  const [q,setQ] = useState({...record, items:record.items?record.items.map(it=>({...it})):[]});
  const [showConvert,setShowConvert] = useState(false);
  const set = (k,v) => setQ({...q,[k]:v});
  const customers = data.partners.filter(p=>p.type==="customer");
  const isConverted = !!q.convertedTransactionId || q.status==="ordered";
  const canConvert = !!q.id && !q.convertedTransactionId && ["draft","submitted","approved"].includes(q.status);

  const addItem = () => {
    const items = [...(q.items||[]), {id:newId("qit"), productId:"", productCode:"", qty:0, unit:"", salePrice:0, taxRate:0.1, discountAmount:0, amount:0, note:""}];
    setQ({...q, items: recomputeQuotationItems(items)});
  };
  const updateItem = (i,k,v) => {
    const items = [...q.items];
    items[i] = {...items[i],[k]:v};
    if (k==="productId") {
      const p = data.products.find(x=>x.id===v);
      if (p) {
        items[i].unit = p.unit;
        items[i].productCode = p.id; // 商品マスタに独立した商品コードが無いため商品IDを流用
        if (p.taxRate !== undefined) items[i].taxRate = p.taxRate;
        // 新規追加時のみ現在の単価マスタからプリフィル。以後は保存された値を凍結し、
        // 「最新単価を再取得」ボタンを押さない限り単価マスタの変更を反映しない。
        if (q.customerId && q.sanchi && q.quotationDate) {
          const price = findPrice(data.prices, q.customerId, v, q.sanchi, q.quotationDate, "sale");
          if (price) items[i].salePrice = price.unitPrice;
        }
      }
    }
    setQ({...q, items: recomputeQuotationItems(items)});
  };
  const removeItem = i => {
    setQ({...q, items: recomputeQuotationItems(q.items.filter((_,x)=>x!==i))});
  };

  // 「最新単価を再取得」: ユーザーが明示的に押したときだけ現在の単価マスタで販売単価を上書きする。
  // 保存済み見積の単価は本来この操作をしない限り一切変化しない(凍結)。
  const refetchPrices = () => {
    if (!confirm("現在の単価マスタから最新の販売単価を再取得します。よろしいですか？(この見積の保存済み単価が上書きされます)")) return;
    const items = q.items.map(it => {
      if (!it.productId || !q.customerId || !q.sanchi) return it;
      const price = findPrice(data.prices, q.customerId, it.productId, q.sanchi, today(), "sale");
      return price ? {...it, salePrice:price.unitPrice} : it;
    });
    setQ({...q, items: recomputeQuotationItems(items)});
  };

  const totals = computeQuotationTotals(q, data.products);

  const trySave = () => {
    const errors = validateQuotation(q);
    if (errors.length) { alert("入力エラー:\n・"+errors.join("\n・")); return; }
    onSave(q);
  };

  return (
    <div className="modal-bg" onClick={onClose}>
      <div className="modal" style={{width:1000}} onClick={e=>e.stopPropagation()}>
        <h3>見積 {q.id?"編集":"新規登録"} {q.quotationNo?`(${q.quotationNo})`:""} <span className="badge badge-hiryou">{QUOTATION_STATUS_LABEL[q.status]||q.status}</span></h3>
        <div className="grid-4">
          <div className="form-row"><label>見積日 *</label><input type="date" value={q.quotationDate||""} onChange={e=>set("quotationDate",e.target.value)}/></div>
          <div className="form-row"><label>有効期限</label><input type="date" value={q.expiryDate||""} onChange={e=>set("expiryDate",e.target.value)}/></div>
          <div className="form-row"><label>販売先 *</label>
            <select value={q.customerId||""} onChange={e=>set("customerId",e.target.value)}>
              <option value="">選択...</option>
              {customers.map(p=><option key={p.id} value={p.id}>{p.name} ({p.kind})</option>)}
            </select>
          </div>
          <div className="form-row"><label>請求先</label>
            <select value={q.billingPartnerId||""} onChange={e=>set("billingPartnerId",e.target.value)}>
              <option value="">(販売先と同じ)</option>
              {data.partners.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
            </select>
          </div>
        </div>
        <div className="grid-4">
          <div className="form-row"><label>宛名</label><input value={q.addressee||""} onChange={e=>set("addressee",e.target.value)}/></div>
          <div className="form-row"><label>先方担当者</label><input value={q.personInCharge||""} onChange={e=>set("personInCharge",e.target.value)}/></div>
          <div className="form-row"><label>納品先</label>

              <option value="">(未指定)</option>

        <div className="form-row"><label>社内メモ</label><input value={q.internalMemo||""} onChange={e=>set("internalMemo",e.target.value)}/></div>

        {q.convertedTransactionId && <div style={{background:"#DEEBF7",color:"#1565C0",padding:8,borderRadius:4,marginBottom:8,fontSize:11}}>この見積は受注登録済みです ({fmtDate(q.convertedAt)} / {q.convertedBy})</div>}

        <div className="flex" style={{justifyContent:"space-between",marginTop:12}}>
          <div>
            {canConvert && <button className="btn btn-success" onClick={()=>setShowConvert(true)}>この見積から受注登録</button>}
          </div>
          <div className="flex">
            <button className="btn btn-secondary" onClick={onClose}>キャンセル</button>
            {!isConverted && <button className="btn btn-primary" onClick={trySave}>保存</button>}
          </div>
        </div>
      </div>
      {showConvert && <QuotationConvertModal quotation={q} data={data} update={update} onClose={(saved)=>{setShowConvert(false); if(saved) onClose();}}/>}
    </div>
  );
}

// 見積 → 受注(取引)転記の確認画面。
// 販売単価は見積時点のまま凍結して引き継ぎ、仕入先・仕入単価だけは現在の単価マスタから
// 都度再取得する(見積はそもそも仕入情報を持たないため)。数量は編集可能=部分転記に対応。
function QuotationConvertModal({quotation,data,update,onClose}){
  const [isConverting,setIsConverting] = useState(false);
  const customer = data.partners.find(p=>p.id===quotation.customerId);
  const billingPartner = data.partners.find(p=>p.id===quotation.billingPartnerId) || customer;
  const deliveryDest = (data.deliveryDestinations||[]).find(d=>d.id===quotation.deliveryDestinationId);
  const suppliers = data.partners.filter(p=>p.type==="supplier");

  const [convItems,setConvItems] = useState(()=> (quotation.items||[]).map(it=>{
    const already = Number(it.partiallyConvertedQty||0);
    const remaining = Math.max(0, Number(it.qty||0) - already);
    const candidates = (data.prices||[]).filter(p=>
      p.productId===it.productId && p.sanchi===quotation.sanchi && p.priceType==="purchase" &&
      new Date(p.startDate) <= new Date(today()) && (!p.endDate || new Date(p.endDate) >= new Date(today()))
    );
    const suggestion = candidates[0] || null;
    return {
      quotationItemId: it.id || null,
      productId: it.productId,
      qty: remaining,
      maxQty: remaining,
      unit: it.unit,
      salePrice: it.salePrice, // 販売単価は見積時点のまま引き継ぐ(再取得しない)
      note: it.note,
      supplierId: suggestion ? suggestion.partnerId : "",
      purchasePrice: suggestion ? suggestion.unitPrice : 0,
    };
  }));

  const setConvItem = (i,k,v) => {
    const items = [...convItems];
    items[i] = {...items[i],[k]:v};
    if (k==="supplierId") {
      const p = findPrice(data.prices, v, items[i].productId, quotation.sanchi, today(), "purchase");
      items[i].purchasePrice = p ? p.unitPrice : items[i].purchasePrice;
    }
    setConvItems(items);
  };

  const doConvert = () => {
    if (isConverting) return; // 連打によるレースコンディション(取引の二重作成)防止
    const qtyItems = convItems.filter(it=>Number(it.qty)>0);
    if (qtyItems.length===0) { alert("転記する数量が0です"); return; }
    setIsConverting(true);
    update(d=>{
      // 二重変換防止: 呼び出し元のstate(quotation)は信用せず、d内の最新状態を再確認してから作成する
      const current = (d.quotations||[]).find(x=>x.id===quotation.id);
      if (!current) { alert("見積が見つかりません"); return d; }
      if (current.convertedTransactionId || current.status==="ordered") {
        alert("この見積は既に受注登録済みです(二重登録を防止しました)");
        return d;
      }
      const now = new Date().toISOString();
      const txItems = qtyItems.map(it=>{
        const saleAmount = Number(it.qty||0)*Number(it.salePrice||0);
        const purchaseAmount = Number(it.qty||0)*Number(it.purchasePrice||0);
        return {
          id: newId("txit"),
          productId: it.productId, qty: Number(it.qty), unit: it.unit,
          salePrice: Number(it.salePrice||0), purchasePrice: Number(it.purchasePrice||0),
          saleAmount, purchaseAmount, grossProfit: saleAmount-purchaseAmount,
          note: it.note||"", supplierId: it.supplierId||"",
          quotationId: current.id, quotationItemId: it.quotationItemId,
          // Phase B: 出荷/納品/返品/取消/請求済数量は受注登録時点では未着手のため全て0で初期化する。
          shippedQty: 0, deliveredQty: 0, returnedQty: 0, cancelledQty: 0, invoicedQty: 0,
        };
      });
      const totalSaleAmount = txItems.reduce((s,it)=>s+it.saleAmount,0);
      const totalPurchaseAmount = txItems.reduce((s,it)=>s+it.purchaseAmount,0);
      const txId = newId("tx");
      d.transactions = d.transactions || [];
      const newTx = {
        id: txId,
        transactionNo: `T-${today().replace(/-/g,"")}-${String(d.transactions.length+1).padStart(3,"0")}`,
        transactionDate: today(), orderDate: today(),
        customerId: current.customerId, supplierId: "",
        sanchi: current.sanchi, sanchiOther: current.sanchiOther||null,
        deliveryDestinationId: current.deliveryDestinationId||null,
        plannedDeliveryDate: current.plannedDeliveryDate||null,
        items: txItems, totalSaleAmount, totalPurchaseAmount, totalGrossProfit: totalSaleAmount-totalPurchaseAmount,
        status:"created", note: `見積 ${current.quotationNo} より受注登録`,
        quotationId: current.id,
      };
      d.transactions = [...d.transactions, newTx];

      // 見積側の各明細に転記済数量を積み上げる。全量転記済みならordered、そうでなければ現状ステータスを維持し、
      // 残数量は今後別途「部分転記」として扱えるようpartiallyConvertedQtyに記録しておく。
      const updatedItems = (current.items||[]).map(it=>{
        const conv = qtyItems.find(ci=>ci.quotationItemId===it.id);
        if (!conv) return it;
        const already = Number(it.partiallyConvertedQty||0);
        return {...it, partiallyConvertedQty: already + Number(conv.qty)};
      });
      const fullyConverted = updatedItems.every(it=>Number(it.partiallyConvertedQty||0) >= Number(it.qty||0));
      const afterQ = {
        ...current, items: updatedItems,
        convertedTransactionId: txId, convertedAt: now, convertedBy: d.meta?.currentUserName||"",
        status: fullyConverted ? "ordered" : current.status,
        updatedAt: now, updatedBy: d.meta?.currentUserName||"",
      };
      d.quotations = d.quotations.map(x=>x.id===current.id?afterQ:x);

      d = addAuditLog(d, {action:"quotation_convert", targetType:"quotation", targetId:current.id, before:current, after:afterQ, reason:`受注登録(取引${newTx.transactionNo})`});
      d = addAuditLog(d, {action:"quotation_convert", targetType:"transaction", targetId:txId, before:null, after:newTx, reason:`見積${current.quotationNo}から受注登録`});
      return d;
    });
    setIsConverting(false);
    onClose(true);
  };

  return (
    <div className="modal-bg" onClick={()=>onClose(false)}>
      <div className="modal" style={{width:900}} onClick={e=>e.stopPropagation()}>
        <h3>見積から受注登録 ({quotation.quotationNo})</h3>
        <p style={{fontSize:11,color:"#666"}}>💡 販売単価は見積時点の単価をそのまま引き継ぎます。仕入先・仕入単価は現在の単価マスタから改めて検索した候補です。数量は必要に応じて変更できます(一部数量のみの転記も可能)。</p>
        <table>
          <tbody>
            <tr><td style={{width:140}}>見積番号</td><td>{quotation.quotationNo}</td></tr>
            <tr><td>販売先</td><td>{customer?.name}</td></tr>
            <tr><td>請求先</td><td>{billingPartner?.name}</td></tr>
            <tr><td>納品先</td><td>{deliveryDest?.name||"(未指定)"}</td></tr>
            <tr><td>納品予定日</td><td>{fmtDate(quotation.plannedDeliveryDate)}</td></tr>
            <tr><td>産地・出荷拠点</td><td>{quotation.sanchi}{quotation.sanchi==="その他"?`(${quotation.sanchiOther||""})`:""}</td></tr>
            <tr><td>支払条件</td><td>{quotation.paymentTerms||"-"}</td></tr>
            <tr><td>備考</td><td>{quotation.note||"-"}</td></tr>
          </tbody>
        </table>
        <div style={{marginTop:10}}>
          <div style={{display:"grid",gridTemplateColumns:"1.4fr 70px 45px 80px 1.2fr 80px 60px",gap:4,padding:"6px",fontSize:10,color:"#888",fontWeight:"bold"}}>
            <div>商品</div><div className="text-center">数量</div><div className="text-center">単位</div>
            <div className="text-center">販売単価(凍結)</div><div className="text-center">仕入先(再取得)</div>
            <div className="text-center">仕入単価</div><div className="text-center">粗利</div>
          </div>
          {convItems.map((it,i)=>{
            const p = data.products.find(x=>x.id===it.productId);
            const gp = (Number(it.qty||0)*Number(it.salePrice||0)) - (Number(it.qty||0)*Number(it.purchasePrice||0));
            return (
              <div className="item-row" key={it.quotationItemId||i} style={{gridTemplateColumns:"1.4fr 70px 45px 80px 1.2fr 80px 60px"}}>
                <div style={{fontSize:12}}>{p?.name||it.productId}</div>
                <input type="number" step="0.01" value={it.qty} onChange={e=>setConvItem(i,"qty",e.target.value)}/>
                <input readOnly value={it.unit||""} style={{background:"#F5F7FA",textAlign:"center"}}/>
                <input readOnly value={"¥"+Number(it.salePrice||0).toLocaleString()} style={{background:"#DDE6F0",textAlign:"right"}}/>
                <select value={it.supplierId||""} onChange={e=>setConvItem(i,"supplierId",e.target.value)}>
                  <option value="">未選択</option>
                  {suppliers.map(sp=><option key={sp.id} value={sp.id}>{sp.name}</option>)}
                </select>
                <input type="number" value={it.purchasePrice||0} onChange={e=>setConvItem(i,"purchasePrice",e.target.value)}/>
                <input readOnly value={"¥"+gp.toLocaleString()} style={{background:gp>=0?"#E2EFDA":"#FFCDCD",textAlign:"right"}}/>
              </div>
            );
          })}
        </div>
        <div className="flex" style={{justifyContent:"flex-end",marginTop:12}}>
          <button className="btn btn-secondary" onClick={()=>onClose(false)}>キャンセル</button>
          <button className="btn btn-success" disabled={isConverting} onClick={doConvert}>この内容で受注登録を確定</button>
        </div>
      </div>
    </div>
  );
}

// ================================================================
// 操作履歴 (監査ログビューア) — Phase C
// 読み取り専用。ここには編集・削除の操作ハンドラは一切実装しない。
// ================================================================

// 対象データを人間可読な名前で解決する(削除済み等で見つからない場合はtargetIdまたは"(削除済み)"を返す)。
function resolveAuditTargetName(data, targetType, targetId) {
  if (!targetId) return "-";
  const find = (arr, pred) => (arr||[]).find(pred);
  let rec = null, label = null;
  switch (targetType) {
    case "transaction": rec = find(data.transactions, t=>t.id===targetId); label = rec?.transactionNo; break;
    case "invoice": rec = find(data.invoices, i=>i.id===targetId); label = rec?.invoiceNo; break;
    case "product": rec = find(data.products, p=>p.id===targetId); label = rec?.name; break;
    case "partner": rec = find(data.partners, p=>p.id===targetId); label = rec?.name; break;
    case "price": {
      rec = find(data.prices, p=>p.id===targetId);
      if (rec) {
        const prod = find(data.products, p=>p.id===rec.productId);
        const partner = find(data.partners, p=>p.id===rec.partnerId);
        label = `${prod?.name||rec.productId} / ${partner?.name||rec.partnerId} / ${rec.sanchi||""}`;
      }
      break;
    }
    case "quotation": rec = find(data.quotations, q=>q.id===targetId); label = rec?.quotationNo; break;
    case "shipment": rec = find(data.shipments, s=>s.id===targetId); label = rec?.shipmentNo; break;
    case "deliveryDestination": rec = find(data.deliveryDestinations, dd=>dd.id===targetId); label = rec?.name; break;
    case "document": rec = find(data.documents, doc=>doc.id===targetId); label = rec?.documentNo; break;
    case "companySettings": return "自社設定(帳票用)";
    case "payment": {
      rec = find(data.payments, p=>p.id===targetId);
      if (rec) label = `${fmtDate(rec.paymentDate)} / ${rec.remitterName||"(振込名義未入力)"} / ${yen(rec.amount)}`;
      break;
    }
    default: break;
  }
  if (rec && label) return label;
  if (rec) return targetId; // レコードは存在するが名前になる項目が空の場合
  return targetId ? `${targetId} (削除済み)` : "(削除済み)";
}

// freeeトークン等の機微情報を防御的にマスクする(現状addAuditLogの書込箇所はfreee設定を対象にしていないため
// 通常はヒットしないはずだが、将来の誤用に備えた保険としてキー名でマスクする)。
function redactSensitiveKey(key) {
  return /token|password|secret|accesstoken/i.test(String(key));
}

// before/afterオブジェクトを比較し、実際に値が異なるフィールドだけを {key, oldValue, newValue} の配列で返す。
function diffAuditFields(before, after) {
  if (!before || !after) return [];
  const keys = new Set([...Object.keys(before||{}), ...Object.keys(after||{})]);
  const diffs = [];
  keys.forEach(k => {
    // items等の入れ子配列/オブジェクトもJSON文字列化して単純比較する(差分があれば1行として表示)
    const ov = before ? before[k] : undefined;
    const nv = after ? after[k] : undefined;
    const os = redactSensitiveKey(k) ? "***" : JSON.stringify(ov);
    const ns = redactSensitiveKey(k) ? "***" : JSON.stringify(nv);
    if (os !== ns) diffs.push({key:k, oldValue: redactSensitiveKey(k)?"***":ov, newValue: redactSensitiveKey(k)?"***":nv});
  });
  return diffs;
}

function fmtDiffValue(v) {
  if (v === undefined) return "(未設定)";
  if (v === null) return "null";
  if (typeof v === "object") return JSON.stringify(v);
  return String(v);
}

// CSV1セル分のエスケープ(カンマ/ダブルクォート/改行を含む場合は"..."で囲みダブルクォートを二重化)
function csvCell(v) {
  const s = v===null||v===undefined ? "" : String(v);
  if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}

function AuditLogRow({log, data}) {
  const [open, setOpen] = useState(false);
  const targetName = resolveAuditTargetName(data, log.targetType, log.targetId);
  const diffs = diffAuditFields(log.before, log.after);
  const isCreate = !log.before && log.after;
  const isDelete = log.before && !log.after;
  return (<>
    <tr>
      <td style={{whiteSpace:"nowrap"}}>{new Date(log.timestamp).toLocaleString('ja-JP')}</td>
      <td>{log.operator || "(未設定)"}</td>
      <td>{AUDIT_ACTION_LABELS[log.action] || log.action}</td>
      <td>{AUDIT_TARGET_TYPE_LABELS[log.targetType] || log.targetType}</td>
      <td style={{fontFamily:"monospace",fontSize:11}}>{log.targetId}</td>
      <td>{targetName}</td>
      <td style={{fontSize:11}}>{log.reason || "-"}</td>
      <td>
        {(diffs.length>0 || isCreate || isDelete) && (
          <button className="btn btn-secondary btn-sm" onClick={()=>setOpen(o=>!o)}>{open?"閉じる":"変更内容"}</button>
        )}
      </td>
    </tr>
    {open && (
      <tr>
        <td colSpan={8} style={{background:"#F5F7FA",fontSize:11}}>
          {isCreate && (
            <div><strong>新規登録内容:</strong> {Object.entries(log.after||{}).filter(([k])=>!redactSensitiveKey(k)).map(([k,v])=>`${k}: ${fmtDiffValue(v)}`).join(" / ")}</div>
          )}
          {isDelete && (
            <div><strong>削除された内容:</strong> {Object.entries(log.before||{}).filter(([k])=>!redactSensitiveKey(k)).map(([k,v])=>`${k}: ${fmtDiffValue(v)}`).join(" / ")}</div>
          )}
          {!isCreate && !isDelete && diffs.length>0 && (
            <table style={{width:"100%"}}>
              <thead><tr><th>項目</th><th>変更前</th><th>変更後</th></tr></thead>
              <tbody>
                {diffs.map(d=><tr key={d.key}><td>{d.key}</td><td>{fmtDiffValue(d.oldValue)}</td><td>{fmtDiffValue(d.newValue)}</td></tr>)}
              </tbody>
            </table>
          )}
          {!isCreate && !isDelete && diffs.length===0 && <div>変更差分なし</div>}
        </td>
      </tr>
    )}
  </>);
}

function AuditLogTab({data}) {
  const log = data.auditLog || [];
  const [dateFrom, setDateFrom] = useState("");
  const [dateTo, setDateTo] = useState("");
  const [operatorFilter, setOperatorFilter] = useState("");
  const [actionFilter, setActionFilter] = useState("");
  const [targetTypeFilter, setTargetTypeFilter] = useState("");
  const [targetIdFilter, setTargetIdFilter] = useState("");
  const [keyword, setKeyword] = useState("");

  const distinctOperators = useMemo(()=>[...new Set(log.map(l=>l.operator).filter(Boolean))].sort(), [log]);
  const distinctActions = useMemo(()=>[...new Set(log.map(l=>l.action).filter(Boolean))].sort(), [log]);
  const distinctTargetTypes = useMemo(()=>[...new Set(log.map(l=>l.targetType).filter(Boolean))].sort(), [log]);

  const filtered = useMemo(()=>{
    return log.filter(l=>{
      if (dateFrom && l.timestamp < dateFrom) return false;
      if (dateTo && l.timestamp > (dateTo+"T23:59:59.999Z")) return false;
      if (operatorFilter && l.operator !== operatorFilter) return false;
      if (actionFilter && l.action !== actionFilter) return false;
      if (targetTypeFilter && l.targetType !== targetTypeFilter) return false;
      if (targetIdFilter && !(l.targetId||"").includes(targetIdFilter)) return false;
      if (keyword) {
        const hay = [
          l.operator, l.action, l.targetType, l.targetId, l.reason,
          JSON.stringify(l.before||{}), JSON.stringify(l.after||{}),
        ].join(" ").toLowerCase();
        if (!hay.includes(keyword.toLowerCase())) return false;
      }
      return true;
    }).sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp)); // 最新順
  }, [log, dateFrom, dateTo, operatorFilter, actionFilter, targetTypeFilter, targetIdFilter, keyword]);

  const exportCsv = () => {
    const header = ["操作日時","操作者","操作区分","対象機能","対象データID","対象データ名","変更理由","変更内容(要約)"];
    const rows = filtered.map(l=>{
      const targetName = resolveAuditTargetName(data, l.targetType, l.targetId);
      const isCreate = !l.before && l.after;
      const isDelete = l.before && !l.after;
      let summary = "";
      if (isCreate) summary = "新規: " + Object.entries(l.after||{}).filter(([k])=>!redactSensitiveKey(k)).map(([k,v])=>`${k}=${fmtDiffValue(v)}`).join("; ");
      else if (isDelete) summary = "削除: " + Object.entries(l.before||{}).filter(([k])=>!redactSensitiveKey(k)).map(([k,v])=>`${k}=${fmtDiffValue(v)}`).join("; ");
      else summary = diffAuditFields(l.before, l.after).map(d=>`${d.key}: ${fmtDiffValue(d.oldValue)} → ${fmtDiffValue(d.newValue)}`).join("; ");
      return [
        new Date(l.timestamp).toLocaleString('ja-JP'),
        l.operator || "",
        AUDIT_ACTION_LABELS[l.action] || l.action,
        AUDIT_TARGET_TYPE_LABELS[l.targetType] || l.targetType,
        l.targetId || "",
        targetName,
        l.reason || "",
        summary,
      ];
    });
    const csv = [header, ...rows].map(r=>r.map(csvCell).join(",")).join("\r\n");
    // 既存のexportJSON()と同じBlob+<a download>方式でダウンロードさせる(このアプリの既存ダウンロード方式を踏襲)。
    const blob = new Blob(["﻿"+csv], {type:"text/csv;charset=utf-8"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = `audit_log_${today()}.csv`; a.click();
  };

  return (
    <div className="card">
      <h2>操作履歴 ({filtered.length}件 / 全{log.length}件)</h2>
      <p style={{fontSize:12,color:"#666",marginBottom:10}}>💡 この画面は読み取り専用です。操作履歴の編集・削除はできません。</p>
      <div className="flex" style={{flexWrap:"wrap",gap:8,marginBottom:12}}>
        <label>期間:</label>
        <input type="date" value={dateFrom} onChange={e=>setDateFrom(e.target.value)}/>
        <span>〜</span>
        <input type="date" value={dateTo} onChange={e=>setDateTo(e.target.value)}/>
        <label>操作者:</label>
        <select value={operatorFilter} onChange={e=>setOperatorFilter(e.target.value)}>
          <option value="">全て</option>
          {distinctOperators.map(o=><option key={o} value={o}>{o}</option>)}
        </select>
        <label>操作区分:</label>
        <select value={actionFilter} onChange={e=>setActionFilter(e.target.value)}>
          <option value="">全て</option>
          {distinctActions.map(a=><option key={a} value={a}>{AUDIT_ACTION_LABELS[a]||a}</option>)}
        </select>
        <label>対象機能:</label>
        <select value={targetTypeFilter} onChange={e=>setTargetTypeFilter(e.target.value)}>
          <option value="">全て</option>
          {distinctTargetTypes.map(t=><option key={t} value={t}>{AUDIT_TARGET_TYPE_LABELS[t]||t}</option>)}
        </select>
        <label>対象ID:</label>
        <input value={targetIdFilter} onChange={e=>setTargetIdFilter(e.target.value)} placeholder="対象データID" style={{width:140}}/>
        <label>キーワード:</label>
        <input value={keyword} onChange={e=>setKeyword(e.target.value)} placeholder="操作者/内容など" style={{width:160}}/>
        <button className="btn btn-secondary btn-sm" onClick={()=>{setDateFrom("");setDateTo("");setOperatorFilter("");setActionFilter("");setTargetTypeFilter("");setTargetIdFilter("");setKeyword("");}}>絞込解除</button>
        <button className="btn btn-primary btn-sm" onClick={exportCsv}>CSV書出</button>
      </div>
      {filtered.length === 0 && <p style={{color:"#999",padding:20}}>該当する操作履歴がありません</p>}
      {filtered.length > 0 && (
        <table>
          <thead>
            <tr>

// ================================================================
// Phase D: 設定タブ(自社情報・帳票印刷用) - meta.companySettingsを編集する
// ================================================================
function SettingsTab({data,update,backendConfig,onSaveBackendConfig,lastSyncTime,showToast}){
  const [c,setC] = useState({...(data.meta?.companySettings||{})});
  // 他画面でのimport/復元・共有データベースのpull等によりdata.meta.companySettingsが変わった場合は編集フォームにも反映する。
  // 依存配列はオブジェクト参照ではなく内容(JSON文字列)にすること。共有データベースのpullは内容が同じでも
  // 毎回新しいオブジェクト参照を作るため、参照比較だと入力中でも無関係なpullのたびにフォームがリセットされてしまう。
  const companySettingsJSON = JSON.stringify(data.meta?.companySettings||{});
  useEffect(()=>{ setC({...(data.meta?.companySettings||{})}); }, [companySettingsJSON]);
  const set = (k,v) => setC(prev=>({...prev,[k]:v}));
  // ---- Phase E: ロット期限間近アラート基準日数。companySettingsとは別のmeta直下フィールドなので、
  // 独立したローカル状態として持ち、保存時のみ一緒にupdate()する(1項目だけの小さな設定のため専用画面は作らない)。
  const [lotThreshold,setLotThreshold] = useState(data.meta?.lotExpiryThresholdDays ?? 30);
  useEffect(()=>{ setLotThreshold(data.meta?.lotExpiryThresholdDays ?? 30); }, [data.meta?.lotExpiryThresholdDays]);

  const handleLogoFile = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => set("companyLogo", ev.target.result);
    reader.readAsDataURL(file);
    e.target.value = "";
  };

  const save = () => {
    update(d=>{
      const before = d.meta?.companySettings || {};
      const beforeThreshold = d.meta?.lotExpiryThresholdDays;
      d.meta = {...(d.meta||{}), companySettings: {...c}, lotExpiryThresholdDays: Number(lotThreshold)||30};
      d = addAuditLog(d, {action:"update", targetType:"companySettings", targetId:"companySettings", before, after:{...c}, reason:"自社設定(帳票用)更新"});
      if (beforeThreshold !== (Number(lotThreshold)||30)) {
        d = addAuditLog(d, {action:"update", targetType:"lot", targetId:"lotExpiryThresholdDays", before:beforeThreshold, after:Number(lotThreshold)||30, reason:"ロット期限間近アラート基準日数の変更"});
      }
      return d;
    });
  };

  return (<>
    <div className="card">
      <h2>設定 (自社情報・帳票印刷用)</h2>
      <p style={{fontSize:11,color:"#666",marginBottom:10}}>💡 ここで入力した内容は見積書・発注書・納品書の発行時点の会社情報として印字されます(発行済みの帳票は、後からここを変更しても内容が変わりません)。</p>
      <div className="grid-3">
        <div className="form-row"><label>会社名</label><input value={c.companyName||""} onChange={e=>set("companyName",e.target.value)}/></div>
        <div className="form-row"><label>郵便番号</label><input value={c.companyZip||""} onChange={e=>set("companyZip",e.target.value)}/></div>
        <div className="form-row"><label>代表者名</label><input value={c.representativeName||""} onChange={e=>set("representativeName",e.target.value)}/></div>
      </div>
      <div className="form-row"><label>住所</label><input value={c.companyAddress||""} onChange={e=>set("companyAddress",e.target.value)}/></div>
      <div className="grid-3">
        <div className="form-row"><label>TEL</label><input value={c.companyTel||""} onChange={e=>set("companyTel",e.target.value)}/></div>
        <div className="form-row"><label>FAX</label><input value={c.companyFax||""} onChange={e=>set("companyFax",e.target.value)}/></div>
        <div className="form-row"><label>メール</label><input value={c.companyEmail||""} onChange={e=>set("companyEmail",e.target.value)}/></div>
      </div>
      <div className="form-row"><label>適格請求書発行事業者登録番号</label><input value={c.invoiceRegistrationNumber||""} onChange={e=>set("invoiceRegistrationNumber",e.target.value)}/></div>
      <div className="grid-4">
        <div className="form-row"><label>振込先銀行名</label><input value={c.bankName||""} onChange={e=>set("bankName",e.target.value)}/></div>
        <div className="form-row"><label>支店名</label><input value={c.bankBranch||""} onChange={e=>set("bankBranch",e.target.value)}/></div>
        <div className="form-row"><label>口座種別</label><input value={c.bankAccountType||""} onChange={e=>set("bankAccountType",e.target.value)} placeholder="普通/当座"/></div>
        <div className="form-row"><label>口座番号</label><input value={c.bankAccountNumber||""} onChange={e=>set("bankAccountNumber",e.target.value)}/></div>
      </div>
      <div className="form-row"><label>口座名義</label><input value={c.bankAccountHolder||""} onChange={e=>set("bankAccountHolder",e.target.value)}/></div>
      <div className="form-row">
        <label>会社ロゴ (帳票ヘッダーに表示・任意)</label>
        <input type="file" accept="image/*" onChange={handleLogoFile}/>
        {c.companyLogo && (
          <div style={{marginTop:6}}>
            <img src={c.companyLogo} alt="logo" style={{maxWidth:160,maxHeight:90}}/>
            <button className="btn btn-secondary btn-sm" style={{marginLeft:8}} onClick={()=>set("companyLogo","")}>ロゴを削除</button>
          </div>
        )}
      </div>
      <div className="form-row"><label>帳票の備考・定型文</label><textarea rows={3} value={c.documentNote||""} onChange={e=>set("documentNote",e.target.value)}/></div>
      <div className="form-row" style={{maxWidth:260}}>
        <label>ロット期限間近アラート基準日数(在庫タブ)</label>
        <input type="number" min="0" value={lotThreshold} onChange={e=>setLotThreshold(e.target.value)}/>
      </div>
      <div className="flex" style={{justifyContent:"flex-end",marginTop:12}}>
        <button className="btn btn-primary" onClick={save}>保存</button>
      </div>
    </div>
    <BackendSyncSection data={data} backendConfig={backendConfig} onSaveBackendConfig={onSaveBackendConfig} lastSyncTime={lastSyncTime} showToast={showToast}/>
  </>);
}

// ================================================================
// 共有データベース(GAS Web App)連携 設定セクション
// ================================================================
function BackendSyncSection({data, backendConfig, onSaveBackendConfig, lastSyncTime, showToast}){
  const [form,setForm] = useState({url:backendConfig.url||"", accessCode:backendConfig.accessCode||""});
  useEffect(()=>{ setForm({url:backendConfig.url||"", accessCode:backendConfig.accessCode||""}); }, [backendConfig.url, backendConfig.accessCode]);
  const [testing,setTesting] = useState(false);
  const [migrating,setMigrating] = useState(false);
  const [migrationProgress,setMigrationProgress] = useState("");

  const handleSave = () => {
    onSaveBackendConfig({...form, enabled: backendConfig.enabled});
    showToast("共有データベース設定を保存しました");
  };

  const handleTest = async () => {
    if (!form.url) { showToast("URLを入力してください"); return; }
    setTesting(true);
    const ok = await backendPing(form);
    setTesting(false);
    showToast(ok ? "接続に成功しました" : "接続に失敗しました。URL・アクセスコードを確認してください");
  };

  const handleToggleEnable = async () => {
    if (backendConfig.enabled) {
      onSaveBackendConfig({...backendConfig, enabled:false});
      showToast("共有データベース連携を無効にしました");
      return;
    }
    if (!form.url) { showToast("URLを入力してください"); return; }
    setTesting(true);
    const ok = await backendPing(form);
    setTesting(false);
    if (!ok) { showToast("接続テストに失敗したため有効化できませんでした"); return; }
    onSaveBackendConfig({...form, enabled:true});
    showToast("共有データベース連携を有効にしました");
  };

  const handleMigrate = async () => {
    if (!form.url || !form.accessCode) { showToast("先にURLとアクセスコードを保存してください"); return; }
    if (!confirm("現在のスプレッドシート上のデータを、このパソコンのデータで上書きします。よろしいですか？")) return;
    setMigrating(true);
    try {
      for (const entity of BACKEND_ENTITIES) {
        const records = data[entity] || [];
        if (records.length === 0) continue;
        for (let i=0;i<records.length;i+=100) {
          const chunk = records.slice(i, i+100);
          setMigrationProgress(`${BACKEND_ENTITY_LABELS[entity]||entity} ${Math.min(i+chunk.length,records.length)}/${records.length}件...`);
          const ok = await backendPushBatch(form, entity, chunk);
          if (!ok) throw new Error(`${BACKEND_ENTITY_LABELS[entity]||entity}の送信に失敗しました`);
        }
      }
      const metaObj = data.meta || {};
      const metaKeys = Object.keys(metaObj);
      for (let i=0;i<metaKeys.length;i++) {
        setMigrationProgress(`設定情報 ${i+1}/${metaKeys.length}件...`);
        const ok = await backendPushMeta(form, metaKeys[i], metaObj[metaKeys[i]]);
        if (!ok) throw new Error("設定情報の送信に失敗しました: "+metaKeys[i]);
      }
      setMigrationProgress("");
      showToast("移行が完了しました");
    } catch(e) {
      setMigrationProgress("");
      showToast("移行に失敗しました: "+e.message);
    } finally {
      setMigrating(false);
    }
  };

  return (
    <div className="card">
      <h2>共有データベース連携</h2>
      <p style={{fontSize:11,color:"#666",marginBottom:10}}>💡 複数のパソコンから同じデータを共有するための設定です。有効にすると、操作するたびにこのパソコンのデータがオンラインの共有データベースへ自動で反映され、他のパソコンの更新も定期的に取り込まれます。</p>
      <div className="grid-2">
        <div className="form-row"><label>Web App URL</label><input value={form.url} onChange={e=>setForm({...form,url:e.target.value})} placeholder="https://script.google.com/macros/s/xxxxx/exec"/></div>
        <div className="form-row"><label>アクセスコード</label><input type="password" value={form.accessCode} onChange={e=>setForm({...form,accessCode:e.target.value})}/></div>
      </div>
      <div className="flex" style={{gap:8,flexWrap:"wrap",marginTop:8}}>
        <button className="btn btn-secondary" onClick={handleTest} disabled={testing}>{testing?"接続確認中...":"接続テスト"}</button>
        <button className="btn btn-primary" onClick={handleSave}>保存</button>
        <button className={backendConfig.enabled?"btn-disc":"btn btn-primary"} onClick={handleToggleEnable} disabled={testing}>
          {backendConfig.enabled ? "無効にする" : "有効にする"}
        </button>
      </div>
      <div style={{fontSize:11,color:"#666",marginTop:6}}>
        状態: {backendConfig.enabled ? "有効" : "無効"} ／ 最終同期日時: {lastSyncTime ? lastSyncTime.toLocaleString('ja-JP') : "未同期"}
      </div>
      <div style={{marginTop:14,paddingTop:10,borderTop:"1px solid #eee"}}>
        <div style={{fontSize:11,color:"#666",marginBottom:6}}>初めて共有データベースを使い始める時、このパソコンの現在のデータをスプレッドシート側へ送る操作です(既にどこかのパソコンで移行済みの場合は不要です)。</div>
        <button className="btn btn-secondary" onClick={handleMigrate} disabled={migrating}>
          {migrating ? "アップロード中..." : "今のデータを共有データベースへアップロード（初回移行）"}
        </button>
        {migrationProgress && <div style={{fontSize:11,color:"#0B5FA5",marginTop:6}}>{migrationProgress}</div>}
      </div>
    </div>
  );
}
