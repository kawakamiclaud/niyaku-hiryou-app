        </table>
      </div>
    </div>
  </>);
}

// ================================================================
// 取引タブ(旧: 受注+発注統合)
// ================================================================
function validateTransaction(t) {
  const errors = [];
  if (!t.customerId) errors.push("お客様(受注先)を選択してください");
  if (!t.items || t.items.length === 0) errors.push("明細を1件以上追加してください");
  (t.items||[]).forEach((it,i)=>{
    if (!(Number(it.qty) > 0)) errors.push(`明細${i+1}: 数量は0より大きい値を入力してください`);
    if (Number(it.salePrice) < 0) errors.push(`明細${i+1}: 受注単価にマイナスは入力できません`);
    if (Number(it.purchasePrice) < 0) errors.push(`明細${i+1}: 発注単価にマイナスは入力できません`);
    // 請求済数量を下回るまで数量を減らすことはできない(請求済数量は必ずdeliveredQty以下、
    // deliveredQty以下の保証はここでqty>=invoicedQtyも保証しておくことで維持する)
    if (Number(it.invoicedQty||0) > 0 && Number(it.qty||0) < Number(it.invoicedQty||0)) {
      errors.push(`明細${i+1}: 既に請求済の数量(${it.invoicedQty})を下回る数量には変更できません`);
    }
    // 既に出荷/納品済の実績数量を下回る数量への変更も同様に禁止(未出荷/未納数量がマイナスになるのを防ぐ)
    if (Number(it.shippedQty||0) > 0 && Number(it.qty||0) < Number(it.shippedQty||0)) {
      errors.push(`明細${i+1}: 既に出荷済の数量(${it.shippedQty})を下回る数量には変更できません`);
    }
  });
  if (!t.transactionDate) errors.push("取引日(受注日)を入力してください");
  const qtyOf = v => v==null || v==="" ? null : Number(v);
  const orderQty = (t.items||[]).reduce((s,it)=>s+(Number(it.qty)||0),0);
  const shipQty = qtyOf(t.shippedQty);
  const delivQty = qtyOf(t.deliveredQty);
  if (shipQty != null && shipQty > orderQty) errors.push("出荷数量が受注数量を超えています");
  if (delivQty != null && shipQty != null && delivQty > shipQty) errors.push("納品数量が出荷数量を超えています");
  return errors;
}

function TransactionsTab({data,update}){
  const [editing,setEditing] = useState(null);
  const [poTx,setPoTx] = useState(null); // 発注書印刷ピッカーの対象取引
  const [filter,setFilter] = useState("all");
  let txs = (data.transactions||[]).sort((a,b)=>b.transactionDate.localeCompare(a.transactionDate));
  if (filter!=="all") txs = txs.filter(t=>t.status===filter);

  const save = (t) => {
    const errors = validateTransaction(t);
    if (errors.length) { alert("入力エラー:\n・"+errors.join("\n・")); return; }
    let isNew = !t.id;
    update(d => {
      d.transactions = d.transactions || [];
      let before = null;
      if (t.id) {
        before = d.transactions.find(x=>x.id===t.id) || null;
        d.transactions = d.transactions.map(x=>x.id===t.id?t:x);
      } else {
        t.id = newId("tx");
        t.transactionNo = `T-${t.transactionDate.replace(/-/g,"")}-${String(d.transactions.length+1).padStart(3,"0")}`;
        t.status = t.status || "created";
        d.transactions = [...d.transactions, t];
      }
      d = addAuditLog(d, {action: isNew?"create":"update", targetType:"transaction", targetId:t.id, before, after:t});
      return d;
    });
    setEditing(null);
  };
  const del = (id) => {
    const t = (data.transactions||[]).find(x=>x.id===id);
    if (!t) return;
    if (t.status === "invoiced") { alert("この取引は請求済のため削除できません。先に請求タブで該当請求を取消してください。"); return; }
    if ((t.items||[]).some(it=>Number(it.invoicedQty||0)>0)) { alert("この取引は一部数量が請求済のため削除できません。先に請求タブで該当請求を取消してください。"); return; }
    if ((data.shipments||[]).some(s=>s.transactionId===id && s.status!=="cancelled")) { alert("この取引には出荷/納品履歴があるため削除できません。先に該当の出荷/納品記録を取消してください。"); return; }
    if (!confirm("取引を削除します。関連する納品情報も削除されます。よろしいですか？")) return;
    update(d=>{
      d = addAuditLog(d, {action:"delete", targetType:"transaction", targetId:id, before:t, after:null});
      d.transactions=d.transactions.filter(x=>x.id!==id);
      return d;
    });
  };
  const cancelTx = (id) => {
    const t = (data.transactions||[]).find(x=>x.id===id);
    if (!t) return;
    if (t.status === "invoiced") { alert("この取引は請求済のため取消できません。先に請求タブで該当請求を取消してください。"); return; }
    if ((t.items||[]).some(it=>Number(it.invoicedQty||0)>0)) { alert("この取引は一部数量が請求済のため取消できません。先に請求タブで該当請求を取消してください。"); return; }
    const reason = prompt("取消理由を入力してください");
    if (reason === null) return;
    update(d=>{
      const before = t;
      // 取消時は各明細の未出荷分(qty-shippedQty-既存cancelledQty)をcancelledQtyへ積み増し、
      // 「未出荷数量=0」として明細一覧・出荷入力画面に反映する(出荷済/納品済分はそのまま履歴として残す)。
      const items = (t.items||[]).map(it=>{
        const remain = Number(it.qty||0) - Number(it.shippedQty||0) - Number(it.cancelledQty||0);
        return remain > 0 ? {...it, cancelledQty: Number(it.cancelledQty||0)+remain} : it;
      });
      const after = {...t, items, status:"cancelled", cancelReason:reason, cancelledAt:new Date().toISOString()};
      d.transactions = d.transactions.map(x=>x.id===id?after:x);
      d = addAuditLog(d, {action:"cancel", targetType:"transaction", targetId:id, before, after, reason});
      // ---- Phase E: この取引に紐づくactive(未出荷)な在庫引当を解放し、他の受注に回せる在庫として戻す。
      // 既にfulfilled(出荷済消込)/released(解放済)の引当はそのまま(二重解放しない)。
      const releasedAllocs = [];
      d.allocations = (d.allocations||[]).map(a=>{
        if (a.transactionId===id && a.status==="active") {
          const relAfter = {...a, status:"released", releasedAt:new Date().toISOString()};
          releasedAllocs.push(relAfter);
          return relAfter;
        }
        return a;
      });
      if (releasedAllocs.length) {
        d = addAuditLog(d, {action:"stock_deallocate", targetType:"allocation", targetId:id, before:null, after:releasedAllocs, reason:`取引取消(${reason})による引当解放 ${releasedAllocs.length}件`});
      }
      return d;
    });
  };

  return (
    <div className="card">
      <div className="flex-between" style={{marginBottom:12}}>
        <h2 style={{border:"none",padding:0}}>取引 ({txs.length}件) 受注＋発注</h2>
        <div className="flex">
          <select value={filter} onChange={e=>setFilter(e.target.value)}>
            <option value="all">全て</option>
            <option value="created">作成済</option>
            <option value="partial_delivered">一部納品</option>
            <option value="delivered">納品✓済</option>
            <option value="invoiced">請求済</option>
            <option value="cancelled">取消済</option>
          </select>
          <button className="btn btn-primary" onClick={()=>setEditing({transactionDate:today(),orderDate:today(),sanchi:"熊本",items:[],status:"created"})}>＋ 新規取引</button>
        </div>
      </div>
      <p style={{fontSize:11,color:"#666",marginBottom:8}}>💡 取引を保存すると自動的に納品タブへ反映され、納品✓を押すと請求タブに集計されます。</p>
      <table>
        <thead><tr>
          <th>取引No.</th><th>日付</th><th>お客様(受注)</th><th>メーカー(発注)</th><th>産地</th>
          <th>品目</th>
          <th className="text-right">受注合計</th>
          <th className="text-right">発注合計</th>
          <th className="text-right">粗利</th>
          <th>状態</th><th></th>
        </tr></thead>
        <tbody>
          {txs.map(t=>{
            const c = data.partners.find(p=>p.id===t.customerId);
            const s = data.partners.find(p=>p.id===t.supplierId);
            const g = (t.totalSaleAmount||0)-(t.totalPurchaseAmount||0);
            return <tr key={t.id}>
              <td>{t.transactionNo}</td>
              <td>{fmtDate(t.transactionDate)}</td>
              <td>{c?.name||"-"}</td>
              <td>{s?.name||"-"}</td>
              <td>{t.sanchi}</td>
              <td style={{fontSize:11}}>{itemSummary(t.items, data.products)}</td>
              <td className="text-right price">{yen(t.totalSaleAmount)}</td>
              <td className="text-right price">{yen(t.totalPurchaseAmount)}</td>
              <td className={"text-right "+(g>=0?"profit":"loss")}>{yen(g)}</td>
              <td><span className={"badge badge-"+(t.status==="cancelled"?"created":t.status)}>{
                {created:"作成済",partial_delivered:"一部納品",delivered:"納品✓",invoiced:"請求済",cancelled:"取消済"}[t.status]||t.status
              }</span></td>
              <td>
                <button className="btn btn-secondary btn-sm" onClick={()=>setEditing(t)}>編集</button>
                <button className="btn btn-secondary btn-sm" style={{marginLeft:4}} onClick={()=>setPoTx(t)}>発注書印刷</button>
                {t.status!=="cancelled" && <button className="btn btn-secondary btn-sm" style={{marginLeft:4}} onClick={()=>cancelTx(t.id)}>取消</button>}
                <button className="btn btn-danger btn-sm" style={{marginLeft:4}} onClick={()=>del(t.id)}>削除</button>
              </td>
            </tr>;
          })}
        </tbody>
      </table>
      {editing && <TransactionModal record={editing} data={data} update={update} onSave={save} onClose={()=>setEditing(null)}/>}
      {poTx && <PurchaseOrderPrintPicker tx={poTx} data={data} update={update} onClose={()=>setPoTx(null)}/>}
    </div>
  );
}

// ---- 発注書印刷ピッカー: 取引に複数の仕入先(明細ごとのsupplierId)が混在する場合、仕入先ごとに
// その仕入先の明細だけを載せた発注書を個別に発行できるようにする(1取引 × N仕入先 = N件のdocuments[])。 ----
function PurchaseOrderPrintPicker({tx,data,update,onClose}){
  const [printDoc,setPrintDoc] = useState(null);
  const supplierIds = [...new Set((tx.items||[]).map(it=>it.supplierId||tx.supplierId).filter(Boolean))];

  const handlePrint = (supplierId) => {
    const existing = findExistingDocument(data.documents, "purchase_order", tx.id, x=>x.snapshot?.supplierId===supplierId);
    if (existing) { setPrintDoc(existing); return; }
    const documentNo = genPurchaseOrderNo(data.documents, today());
    const {doc, isNew} = prepareDocument(data, {
      documentType:"purchase_order", sourceId: tx.id, documentNo,
      buildSnapshot: () => buildPurchaseOrderSnapshot(tx, supplierId, data, documentNo),
      extraMatch: x=>x.snapshot?.supplierId===supplierId,
    });
    if (isNew) update(d => commitDocumentIssue(d, doc, `取引${tx.transactionNo}`));
    setPrintDoc(doc);
  };

  return (
    <div className="modal-bg" onClick={onClose}>
      <div className="modal no-print" style={{width:500}} onClick={e=>e.stopPropagation()}>
        <h3>発注書印刷 - {tx.transactionNo}</h3>
        <p style={{fontSize:11,color:"#666",marginBottom:10}}>💡 仕入先ごとに、その仕入先の明細だけを載せた発注書を個別に発行します。</p>
        {supplierIds.length===0 && <p style={{fontSize:12,color:"#999"}}>この取引には仕入先が設定された明細がありません。</p>}
        {supplierIds.map(sid=>{
          const sp = data.partners.find(p=>p.id===sid);
          const already = findExistingDocument(data.documents, "purchase_order", tx.id, x=>x.snapshot?.supplierId===sid);
          return (
            <div key={sid} className="flex-between" style={{marginBottom:8,padding:8,background:"#F9FAFB",borderRadius:4}}>
              <span>{sp?.name||sid} {already && <span className="badge badge-invoiced" style={{marginLeft:6}}>発行済({already.documentNo})</span>}</span>
              <button className="btn btn-secondary btn-sm" onClick={()=>handlePrint(sid)}>{already?"表示/再印刷":"PO印刷"}</button>
            </div>
          );
        })}
        <div className="flex" style={{justifyContent:"flex-end",marginTop:10}}>
          <button className="btn btn-secondary" onClick={onClose}>閉じる</button>
        </div>
      </div>
      {printDoc && <DocumentPrintView doc={printDoc} update={update} onClose={()=>setPrintDoc(null)}/>}
    </div>
  );
}

function TransactionModal({record,data,update,onSave,onClose}){
  const [r,setR] = useState({...record, items:record.items?record.items.map(it=>({...it})):[]});
  const [allocatingItem,setAllocatingItem] = useState(null); // 在庫引当モーダルの対象明細
  const set = (k,v) => setR({...r,[k]:v});
  const customers = data.partners.filter(p=>p.type==="customer");
  const suppliers = data.partners.filter(p=>p.type==="supplier");

  // stockMode既定値の考え方: メーカー(発注先)の選択欄が「(発注不要=在庫から)」を空欄時の既定表示にしている通り、
  // このアプリは元々「発注先を指定しない=在庫から出す」ことを既定の取引形態として想定している。
  // よってPhase Eで追加するstockModeも既定値は"stock"(在庫販売)とし、既存取引(=全て在庫からの想定)の挙動を変えない。
  const addItem = () => setR({...r,items:[...(r.items||[]),{id:newId("txit"),productId:"",qty:0,salePrice:0,purchasePrice:0,saleAmount:0,purchaseAmount:0,grossProfit:0,note:"",supplierId:r.supplierId||"",shippedQty:0,deliveredQty:0,returnedQty:0,cancelledQty:0,invoicedQty:0,stockMode:"stock"}]});

  const recompute = (items) => {
    let ts=0, tp=0;
    items.forEach(it => {
      it.saleAmount = Number(it.qty||0) * Number(it.salePrice||0);
      it.purchaseAmount = Number(it.qty||0) * Number(it.purchasePrice||0);
      it.grossProfit = it.saleAmount - it.purchaseAmount;
      ts += it.saleAmount;
      tp += it.purchaseAmount;
    });
    return {items, totalSaleAmount:ts, totalPurchaseAmount:tp, totalGrossProfit:ts-tp};
  };

  const updateItem = (i,k,v) => {
    const items = [...r.items];
    items[i] = {...items[i],[k]:v};
    // 商品/数量/産地/取引先/明細ごとの仕入先が変わったら単価を自動再取得
    if (k==="productId" || k==="qty" || k==="supplierId") {
      const it = items[i];
      if (it.productId && r.customerId && r.sanchi){
        const sale = findPrice(data.prices,r.customerId,it.productId,r.sanchi,r.transactionDate,"sale");
        if (sale && !it.salePriceManual) it.salePrice = sale.unitPrice;
      }
      const effSupplierId = it.supplierId || r.supplierId;
      if (it.productId && effSupplierId && r.sanchi){
        const purchase = findPrice(data.prices,effSupplierId,it.productId,r.sanchi,r.transactionDate,"purchase");
        if (purchase && !it.purchasePriceManual) it.purchasePrice = purchase.unitPrice;
      }
    }
    if (k==="salePrice") items[i].salePriceManual = true;
    if (k==="purchasePrice") items[i].purchasePriceManual = true;
    const upd = recompute(items);
    setR({...r,...upd});
  };

  const removeItem = i => {
    const target = r.items[i];
    if (target && (Number(target.invoicedQty||0)>0 || Number(target.shippedQty||0)>0 || Number(target.deliveredQty||0)>0)) {
      alert("この明細は既に出荷/納品/請求の実績があるため削除できません。");
      return;
    }
    const items = r.items.filter((_,x)=>x!==i);
    const upd = recompute(items);
    setR({...r,...upd});
  };

  // 取引先変更時、既存の品目の単価を再取得(明細ごとのsupplierIdを優先)
  useEffect(()=>{
    if (!r.items || r.items.length===0) return;
    const items = r.items.map(it => {
      const it2 = {...it};
      if (it.productId && r.customerId && r.sanchi && !it.salePriceManual){
        const sale = findPrice(data.prices,r.customerId,it.productId,r.sanchi,r.transactionDate,"sale");
        if (sale) it2.salePrice = sale.unitPrice;
      }
      const effSupplierId = it.supplierId || r.supplierId;
      if (it.productId && effSupplierId && r.sanchi && !it.purchasePriceManual){
        const purchase = findPrice(data.prices,effSupplierId,it.productId,r.sanchi,r.transactionDate,"purchase");
        if (purchase) it2.purchasePrice = purchase.unitPrice;
      }
      return it2;
    });
    const upd = recompute(items);
    setR(prev=>({...prev,...upd}));
    // eslint-disable-next-line
  },[r.customerId,r.supplierId,r.sanchi,r.transactionDate]);

  const isLocked = r.status==="invoiced";
  const selectedCustomer = data.partners.find(p=>p.id===r.customerId);
  const customerSuspended = selectedCustomer && (selectedCustomer.suspended || selectedCustomer.active===false);

  const trySave = () => {
    const errors = validateTransaction(r);
    if (errors.length) { alert("入力エラー:\n・"+errors.join("\n・")); return; }
    onSave(r);
  };

  return (
    <div className="modal-bg" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <h3>取引 {r.id?"編集":"新規登録"} {r.transactionNo?`(${r.transactionNo})`:""} {isLocked && <span className="badge badge-invoiced">請求済(編集不可)</span>}</h3>
        {customerSuspended && <div style={{background:"#FCE4D6",color:"#C05621",padding:8,borderRadius:4,marginBottom:8,fontSize:11}}>⚠ このお客様は取引停止/無効中です。取引内容を確認してください。</div>}
        <div className="grid-4">
          <div className="form-row"><label>受注日(取引日) *</label><input type="date" value={r.transactionDate||""} onChange={e=>{set("transactionDate",e.target.value);set("orderDate",e.target.value);}} disabled={isLocked}/></div>
          <div className="form-row"><label>お客様 (受注先) *</label>
            <select value={r.customerId||""} onChange={e=>set("customerId",e.target.value)} disabled={isLocked}>
              <option value="">選択...</option>
              {customers.map(p=><option key={p.id} value={p.id}>{p.name} ({p.kind}){(p.suspended||p.active===false)?" [停止中]":""}</option>)}
            </select>
          </div>
          <div className="form-row"><label>メーカー (発注先・デフォルト仕入先)</label>
            <select value={r.supplierId||""} onChange={e=>set("supplierId",e.target.value)} disabled={isLocked}>
              <option value="">(発注不要=在庫から)</option>
              {suppliers.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
            </select>
          </div>
          <div className="form-row"><label>産地・出荷拠点</label>
            <select value={r.sanchi||"熊本"} onChange={e=>set("sanchi",e.target.value)} disabled={isLocked}><option>熊本</option><option>広島</option><option>その他</option></select>
          </div>
        </div>
        <div className="grid-4">
          {r.sanchi==="その他" && <div className="form-row"><label>産地・出荷拠点(その他・自由記入)</label><input value={r.sanchiOther||""} onChange={e=>set("sanchiOther",e.target.value)} disabled={isLocked}/></div>}
          <div className="form-row"><label>納品先</label>
            <select value={r.deliveryDestinationId||""} onChange={e=>set("deliveryDestinationId",e.target.value||null)} disabled={isLocked}>
              <option value="">(未指定)</option>
              {(data.deliveryDestinations||[]).filter(dd=>dd.partnerId===r.customerId && dd.active!==false).map(dd=><option key={dd.id} value={dd.id}>{dd.name}</option>)}
            </select>
          </div>
        </div>
        <div className="grid-4">
          <div className="form-row"><label>出荷予定日</label><input type="date" value={r.plannedShipDate||""} onChange={e=>set("plannedShipDate",e.target.value)} disabled={isLocked}/></div>
          <div className="form-row"><label>出荷日</label><input type="date" value={r.actualShipDate||""} onChange={e=>set("actualShipDate",e.target.value)} disabled={isLocked}/></div>
          <div className="form-row"><label>納品予定日</label><input type="date" value={r.plannedDeliveryDate||""} onChange={e=>set("plannedDeliveryDate",e.target.value)} disabled={isLocked}/></div>
          <div className="form-row"><label>検収日</label><input type="date" value={r.inspectionDate||""} onChange={e=>set("inspectionDate",e.target.value)} disabled={isLocked}/></div>
        </div>
        <div className="grid-4">
          <div className="form-row"><label>出荷数量(数量チェック用・任意)</label><input type="number" step="0.01" value={r.shippedQty||""} onChange={e=>set("shippedQty",e.target.value)} disabled={isLocked}/></div>
          <div className="form-row"><label>納品数量(数量チェック用・任意)</label><input type="number" step="0.01" value={r.deliveredQty||""} onChange={e=>set("deliveredQty",e.target.value)} disabled={isLocked}/></div>
          <div className="form-row"><label>納品日 (実績・自動記録)</label><input type="date" value={r.deliveredDate||""} onChange={e=>set("deliveredDate",e.target.value)} disabled={isLocked}/></div>
        </div>
        <div style={{marginTop:8}}>
          <div className="flex-between" style={{marginBottom:6}}>
            <strong>明細 (商品ごとに数量・受注単価・発注単価・仕入先)</strong>
            {!isLocked && <button className="btn btn-secondary btn-sm" onClick={addItem}>＋ 品目追加</button>}
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1.6fr 55px 45px 80px 80px 1.2fr 80px 80px 70px 30px",gap:4,padding:"6px",fontSize:10,color:"#888",fontWeight:"bold"}}>
            <div>商品</div><div className="text-center">数量</div><div className="text-center">単位</div>
            <div className="text-center">受注単価</div><div className="text-center">受注金額</div>
            <div className="text-center">仕入先</div>
            <div className="text-center">発注単価</div><div className="text-center">発注金額</div>
            <div className="text-center">粗利</div><div></div>
          </div>
          {(r.items||[]).map((it,i)=>{
            const p = data.products.find(x=>x.id===it.productId);
            return (
              <div className="item-row" key={i} style={{gridTemplateColumns:"1.6fr 55px 45px 80px 80px 1.2fr 80px 80px 70px 30px"}}>
                <select value={it.productId||""} onChange={e=>updateItem(i,"productId",e.target.value)} disabled={isLocked}>
                  <option value="">商品選択</option>
                  {data.products.filter(p=>p.active).map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
                </select>
                <input type="number" step="0.01" placeholder="数量" value={it.qty||""} onChange={e=>updateItem(i,"qty",e.target.value)} disabled={isLocked}/>
                <input readOnly value={p?.unit||""} style={{background:"#F5F7FA",textAlign:"center"}}/>
                <input type="number" placeholder="受注単価" value={it.salePrice||""} onChange={e=>updateItem(i,"salePrice",e.target.value)} disabled={isLocked}/>
                <input readOnly value={"¥"+(it.saleAmount||0).toLocaleString()} style={{background:"#DDE6F0",fontWeight:"bold",textAlign:"right"}}/>
                <select value={it.supplierId||""} onChange={e=>updateItem(i,"supplierId",e.target.value)} disabled={isLocked}>
                  <option value="">(取引デフォルト)</option>
                  {suppliers.map(sp=><option key={sp.id} value={sp.id}>{sp.name}</option>)}
                </select>
                <input type="number" placeholder="発注単価" value={it.purchasePrice||""} onChange={e=>updateItem(i,"purchasePrice",e.target.value)} disabled={isLocked}/>
                <input readOnly value={"¥"+(it.purchaseAmount||0).toLocaleString()} style={{background:"#FCE4D6",fontWeight:"bold",textAlign:"right"}}/>
                <input readOnly value={"¥"+(it.grossProfit||0).toLocaleString()} style={{background:(it.grossProfit||0)>=0?"#E2EFDA":"#FFCDCD",fontWeight:"bold",textAlign:"right"}}/>
                {!isLocked && <button className="btn btn-danger btn-sm" onClick={()=>removeItem(i)}>×</button>}
              </div>
            );
          })}
          {/* ---- Phase E: 明細ごとの在庫販売/取寄せ/直送区分と、在庫販売分の在庫引当操作。
              引当はこの取引・明細が既に保存済(r.id/it.idが確定済)でないと紐付け先が無いため、新規作成中は引当不可の案内のみ表示する。 ---- */}
          {(r.items||[]).map((it,i)=>{
            if (!it.productId) return null;
            const activeAllocs = (data.allocations||[]).filter(a=>a.transactionItemId===it.id && a.status==="active");
            const allocQty = activeAllocs.reduce((s,a)=>s+Number(a.qty||0),0);
            const fulfilledQty = (data.allocations||[]).filter(a=>a.transactionItemId===it.id && a.status==="fulfilled").reduce((s,a)=>s+Number(a.qty||0),0);
            return (
              <div key={"sm-"+i} className="flex" style={{marginTop:-4,marginBottom:6,paddingLeft:6,fontSize:11,color:"#555"}}>
                <label style={{fontWeight:"normal"}}>在庫区分:</label>
                <select style={{width:100}} value={it.stockMode||"stock"} onChange={e=>updateItem(i,"stockMode",e.target.value)} disabled={isLocked}>
                  <option value="stock">在庫販売</option>
                  <option value="backorder">取寄せ</option>
                  <option value="direct">直送</option>
                </select>
                {(it.stockMode||"stock")==="stock" && r.id && it.id && (
                  <>
                    <span>引当中: {allocQty} / 出荷消込済: {fulfilledQty}</span>
                    <button type="button" className="btn btn-secondary btn-sm" onClick={()=>setAllocatingItem(it)}>在庫引当</button>
                  </>
                )}
                {(it.stockMode||"stock")==="stock" && (!r.id || !it.id) && (
                  <span style={{color:"#999"}}>(保存後に在庫引当が可能になります)</span>
                )}
              </div>
            );
          })}
        </div>
        <div className="summary-box">
          <div className="item"><div className="lbl">受注合計(お客様)</div><div className="val">{yen(r.totalSaleAmount)}</div></div>
          <div className="item"><div className="lbl">発注合計(メーカー)</div><div className="val">{yen(r.totalPurchaseAmount)}</div></div>
          <div className="item"><div className="lbl">粗利</div><div className="val" style={{color:(r.totalGrossProfit||0)>=0?"#1E7D34":"#DC3545"}}>{yen(r.totalGrossProfit)}</div></div>
          <div className="item"><div className="lbl">粗利率</div><div className="val">{r.totalSaleAmount>0?((r.totalGrossProfit/r.totalSaleAmount)*100).toFixed(1)+"%":"-"}</div></div>
        </div>
        <div className="form-row" style={{marginTop:10}}><label>備考</label><input value={r.note||""} onChange={e=>set("note",e.target.value)} disabled={isLocked}/></div>
        <div className="flex" style={{justifyContent:"flex-end",marginTop:12}}>
          <button className="btn btn-secondary" onClick={onClose}>キャンセル</button>
          {!isLocked && <button className="btn btn-primary" onClick={trySave}>保存</button>}
        </div>
      </div>
      {allocatingItem && <AllocationModal transaction={r} item={allocatingItem} data={data} update={update} onClose={()=>setAllocatingItem(null)}/>}
    </div>
  );
}

// ---- Phase E: 在庫引当モーダル。使用可能在庫(=現在庫-他の引当済み在庫)を超える引当は原則禁止し、
// 管理者判断で許可する場合のみ理由必須で例外を認める。 ----
function AllocationModal({transaction,item,data,update,onClose}){
  const product = data.products.find(p=>p.id===item.productId);
  const warehouses = (data.warehouses||[]).filter(w=>w.active!==false);
  const [warehouseId,setWarehouseId] = useState(warehouses[0]?.id||"");
  const [lotId,setLotId] = useState("");
  const [qty,setQty] = useState("");
  const [override,setOverride] = useState(false);
  const [overrideReason,setOverrideReason] = useState("");

  const lotsHere = product ? (data.lots||[]).filter(l=>l.productId===product.id && l.warehouseId===warehouseId) : [];

  const onHand = warehouseId ? stockOnHand(data.inventoryMovements, item.productId, warehouseId, lotId||null) : 0;
  const alreadyAllocated = warehouseId ? allocatedQtyFor(data, item.productId, warehouseId, lotId||null) : 0;
  const available = onHand - alreadyAllocated;

  const confirm = () => {
    if (product?.lotManaged && !lotId) { alert("この商品はロット管理対象です。ロットを選択してください。"); return; }
    const q = Number(qty);
    if (!q || q<=0) { alert("引当数量を入力してください。"); return; }
    if (q > available && !override) {
      alert(`使用可能在庫(${available})を超える引当はできません。管理者判断で許可する場合は「管理者判断で許可」にチェックし、理由を入力してください。`);
      return;
    }
    if (override && !overrideReason.trim()) { alert("管理者判断で許可する場合は理由の入力が必須です。"); return; }
    update(d=>{
      d.allocations = d.allocations || [];
      const rec = {
        id: newId("alloc"), transactionId: transaction.id, transactionItemId: item.id,
        warehouseId, lotId: lotId||null, qty: q, status: "active",
        createdAt: new Date().toISOString(), releasedAt: null,
        overrideReason: (q>available && override) ? overrideReason.trim() : null,
      };
      d.allocations = [...d.allocations, rec];
      d = addAuditLog(d, {action:"stock_allocate", targetType:"allocation", targetId:rec.id, before:null, after:rec,
        reason: (q>available && override) ? `使用可能在庫超過につき管理者判断で許可: ${overrideReason.trim()}` : ""});
      return d;
    });
    onClose();
  };

  return (
    <div className="modal-bg" onClick={onClose}>
      <div className="modal" style={{width:480}} onClick={e=>e.stopPropagation()}>
        <h3>在庫引当 - {product?.name||""}</h3>
        <div className="form-row"><label>倉庫</label>
          <select value={warehouseId} onChange={e=>{setWarehouseId(e.target.value);setLotId("");}}>
            {warehouses.map(w=><option key={w.id} value={w.id}>{w.name}</option>)}
          </select>
        </div>
        {product?.lotManaged && (
          <div className="form-row"><label>ロット *</label>
            <select value={lotId} onChange={e=>setLotId(e.target.value)}>
              <option value="">選択...</option>
              {lotsHere.map(l=>{
                const st = computeLotStatus(l, today(), data.meta?.lotExpiryThresholdDays ?? 30);
                return <option key={l.id} value={l.id} disabled={st==="expired"}>{l.lotNo} (期限:{fmtDate(l.expiryDate)} / {LOT_STATUS_LABELS[st]})</option>;
              })}
            </select>
          </div>
        )}
        <div className="form-row"><label>使用可能在庫(現在庫-他の引当済み)</label><input readOnly value={available} style={{background:"#F5F7FA"}}/></div>
        <div className="form-row"><label>引当数量 *</label><input type="number" step="0.01" value={qty} onChange={e=>setQty(e.target.value)}/></div>
        <div className="form-row">
          <label style={{display:"inline-flex",alignItems:"center",gap:6}}>
            <input type="checkbox" style={{width:"auto"}} checked={override} onChange={e=>setOverride(e.target.checked)}/>
            使用可能在庫を超える引当を管理者判断で許可する
          </label>
        </div>
        {override && <div className="form-row"><label>許可理由 *</label><input value={overrideReason} onChange={e=>setOverrideReason(e.target.value)}/></div>}
        <div className="flex" style={{justifyContent:"flex-end",marginTop:12}}>
          <button className="btn btn-secondary" onClick={onClose}>キャンセル</button>
          <button className="btn btn-primary" onClick={confirm}>引当を確定</button>
        </div>
      </div>
    </div>
  );
}

// ================================================================
// 納品タブ (取引と連動)
// ================================================================
function DeliveriesTab({data,update}){
  const [filter,setFilter] = useState("all"); // all / pending(created) / done(delivered)
  const [shipModalTx,setShipModalTx] = useState(null); // 明細ごとの出荷/納品入力モーダルの対象取引
  let txs = (data.transactions||[]).sort((a,b)=>b.transactionDate.localeCompare(a.transactionDate));
  txs = txs.filter(t=>t.status!=="cancelled");
  if (filter==="pending") txs = txs.filter(t=>t.status==="created"||t.status==="partial_delivered");
  else if (filter==="done") txs = txs.filter(t=>t.status==="delivered"||t.status==="invoiced");

  const hasShipments = (id) => (data.shipments||[]).some(s=>s.transactionId===id && s.status!=="cancelled");

  // ---- 従来通りの「取引まるごと納品✓」クイック操作(明細ごとの出荷/納品記録が無い取引のみ使用可) ----
  const markDelivered = (id) => {
    const t = (data.transactions||[]).find(x=>x.id===id);
    if (!t) return;
    if (hasShipments(id)) { alert("この取引は明細ごとの出荷/納品記録があるため、「明細ごとに入力」から操作してください。"); return; }
    update(d=>{
      const before = d.transactions.find(x=>x.id===id);
      const items = (before.items||[]).map(it=>({...it, shippedQty:Number(it.qty)||0, deliveredQty:Number(it.qty)||0}));
      const after = {...before, items, status:"delivered", deliveredDate:before.deliveredDate||today()};
      d.transactions = d.transactions.map(x=>x.id===id?after:x);
      d = addAuditLog(d, {action:"update", targetType:"transaction", targetId:id, before, after, reason:"納品✓"});
      return d;
    });
  };
  const revert = (id) => {
    const t = (data.transactions||[]).find(x=>x.id===id);
    if (!t) return;
    if (hasShipments(id)) { alert("この取引は明細ごとの出荷/納品記録があるため、「明細ごとに入力」から操作してください。"); return; }
    if ((t.items||[]).some(it=>Number(it.invoicedQty||0)>0)) { alert("既に請求済の数量が含まれるため取消できません。"); return; }
    if (!confirm("納品✓を取り消しますか？")) return;
    update(d=>{
      const before = d.transactions.find(x=>x.id===id);
      const items = (before.items||[]).map(it=>({...it, shippedQty:0, deliveredQty:0}));
      const after = {...before, items, status:"created", deliveredDate:null};
      d.transactions = d.transactions.map(x=>x.id===id?after:x);
      d = addAuditLog(d, {action:"update", targetType:"transaction", targetId:id, before, after, reason:"納品✓取消"});
      return d;
    });
  };

  const STATUS_LABEL = {created:"納品予定",partial_delivered:"一部納品",delivered:"納品✓済",invoiced:"請求済"};

  return (
    <div className="card">
      <div className="flex-between" style={{marginBottom:12}}>
        <h2 style={{border:"none",padding:0}}>納品 ({txs.length}件)</h2>
        <select value={filter} onChange={e=>setFilter(e.target.value)}>
          <option value="all">全て表示</option>
          <option value="pending">未✓ (納品前)</option>
          <option value="done">✓済</option>
        </select>
      </div>
      <p style={{fontSize:11,color:"#666",marginBottom:8}}>💡 取引タブで作成した内容が納品予定として自動的に表示されます。全量まとめてなら「納品✓」、一部だけ出荷/納品する場合は「明細ごとに入力」から出荷・納品数量を記録してください。</p>
      <table>
        <thead><tr>
          <th>取引No.</th><th>取引日</th><th>お客様</th><th>産地</th>
          <th>品目</th><th className="text-right">金額</th><th>納品状態</th><th>納品日</th><th></th>
        </tr></thead>
        <tbody>
          {txs.map(t=>{
            const c = data.partners.find(p=>p.id===t.customerId);
            const shipped = hasShipments(t.id);
            return <tr key={t.id}>
              <td>{t.transactionNo}</td>
              <td>{fmtDate(t.transactionDate)}</td>
              <td>{c?.name||"-"}</td>
              <td>{t.sanchi}</td>
              <td style={{fontSize:11}}>{itemSummary(t.items, data.products)}</td>
              <td className="text-right price">{yen(t.totalSaleAmount)}</td>
              <td><span className={"badge badge-"+t.status}>{STATUS_LABEL[t.status]||t.status}</span></td>
              <td>{t.deliveredDate?fmtDate(t.deliveredDate):"-"}</td>
              <td>
                {t.status!=="invoiced" && <button className="btn btn-secondary btn-sm" onClick={()=>setShipModalTx(t)}>明細ごとに入力</button>}
                {!shipped && t.status==="created" && <button className="btn btn-success btn-sm" style={{marginLeft:4}} onClick={()=>markDelivered(t.id)}>納品✓(全量)</button>}
                {!shipped && t.status==="delivered" && <button className="btn btn-secondary btn-sm" style={{marginLeft:4}} onClick={()=>revert(t.id)}>取消</button>}
                {t.status==="invoiced" && <span style={{fontSize:10,color:"#888"}}>請求済のため変更不可</span>}
              </td>
            </tr>;
          })}
        </tbody>
      </table>
      {shipModalTx && <ShipmentEntryModal transaction={shipModalTx} data={data} update={update} onClose={()=>setShipModalTx(null)}/>}
    </div>
  );
}

// ================================================================
// 明細ごとの出荷/納品入力モーダル (Phase B) - transactionに対して複数回の出荷/納品(shipments[])を記録する
// ================================================================
function ShipmentEntryModal({transaction,data,update,onClose}){
  // モーダルを開いている間もdataの最新版から対象取引を追従する(他タブでの変更を反映するため)
  const tx = (data.transactions||[]).find(t=>t.id===transaction.id) || transaction;
  const myShipments = (data.shipments||[]).filter(s=>s.transactionId===tx.id).sort((a,b)=>(b.shipmentDate||"").localeCompare(a.shipmentDate||""));
  const dests = (data.deliveryDestinations||[]).filter(dd=>dd.partnerId===tx.customerId && dd.active!==false);

  const [editingShipment,setEditingShipment] = useState(null); // null=新規, {..shipment}=編集中
  const [printDoc,setPrintDoc] = useState(null); // 納品書印刷対象のdocumentレコード
  const [header,setHeader] = useState({
    shipmentDate: today(), plannedDeliveryDate: tx.plannedDeliveryDate||"", actualDeliveryDate:"",
    originBase: tx.sanchi||"熊本", deliveryDestinationId: tx.deliveryDestinationId||"",
    carrier:"", trackingNo:"", deliveryMethod:"", note:"",
  });
  // 明細ごとの「今回出荷」「今回納品」「今回返品」入力値
  const [qtyInputs,setQtyInputs] = useState(()=>{
    const init = {};
    (tx.items||[]).forEach(it=>{
      const unshipped = Math.max(0, Number(it.qty||0)-Number(it.shippedQty||0)-Number(it.cancelledQty||0));
      init[it.id] = {ship: unshipped>0?String(unshipped):"0", deliv:"0", ret:"0"};
    });
    return init;
  });

  const setHeaderField = (k,v) => setHeader({...header,[k]:v});
  const setQty = (itemId,k,v) => setQtyInputs({...qtyInputs,[itemId]:{...qtyInputs[itemId],[k]:v}});

  const startEdit = (s) => {
    setEditingShipment(s);
    setHeader({
      shipmentDate: s.shipmentDate||today(), plannedDeliveryDate: s.plannedDeliveryDate||"",
      actualDeliveryDate: s.actualDeliveryDate||"", originBase: s.originBase||tx.sanchi||"熊本",
      deliveryDestinationId: s.deliveryDestinationId||"", carrier: s.carrier||"", trackingNo: s.trackingNo||"",
      deliveryMethod: s.deliveryMethod||"", note: s.note||"",
    });
    const init = {};
    (tx.items||[]).forEach(it=>{
      const si = (s.items||[]).find(x=>x.transactionItemId===it.id);
      init[it.id] = {ship: String(si?.shippedQty||0), deliv: String(si?.deliveredQty||0), ret: String(si?.returnedQty||0)};
    });
    setQtyInputs(init);
  };
  const cancelEdit = () => {
    setEditingShipment(null);
    const init = {};
    (tx.items||[]).forEach(it=>{
      const unshipped = Math.max(0, Number(it.qty||0)-Number(it.shippedQty||0)-Number(it.cancelledQty||0));
      init[it.id] = {ship: unshipped>0?String(unshipped):"0", deliv:"0", ret:"0"};
    });
    setQtyInputs(init);
  };

  const doSave = () => {
    if (!header.shipmentDate) { alert("出荷日を入力してください"); return; }
    // 編集中の出荷分を除いた、他の有効な出荷履歴からの現在値(基準値)を算出
    const others = myShipments.filter(s=>s.status!=="cancelled" && (!editingShipment || s.id!==editingShipment.id));
    const base = {};
    (tx.items||[]).forEach(it=>{ base[it.id] = {shipped:0, delivered:0, returned:0}; });
    others.forEach(s=>{
      (s.items||[]).forEach(si=>{
        if (base[si.transactionItemId]) {
          base[si.transactionItemId].shipped += Number(si.shippedQty)||0;
          base[si.transactionItemId].delivered += Number(si.deliveredQty)||0;
          base[si.transactionItemId].returned += Number(si.returnedQty)||0;
        }
      });
    });
    const errors = [];
    const shipmentItems = [];
    const newTotals = {}; // 保存後の各明細の累計(出荷済/納品済/返品)。入力欄リセットに使う(stale txを参照しないため)。
    (tx.items||[]).forEach(it=>{
      const p = data.products.find(x=>x.id===it.productId);
      const inp = qtyInputs[it.id] || {ship:"0",deliv:"0",ret:"0"};
      const shipQty = Number(inp.ship)||0, delivQty = Number(inp.deliv)||0, retQty = Number(inp.ret)||0;
      if (shipQty===0 && delivQty===0 && retQty===0) return;
      if (shipQty<0 || delivQty<0 || retQty<0) { errors.push(`${p?.name||"商品"}: 数量にマイナスは入力できません`); return; }
      const b = base[it.id];
      const newShipped = b.shipped + shipQty;
      const newDelivered = b.delivered + delivQty;
      const newReturned = b.returned + retQty;
      const qty = Number(it.qty)||0;
      const cancelled = Number(it.cancelledQty)||0;
      // 未出荷数量 = 受注数量 - 出荷済数量 - 取消数量 が0未満にならないこと
      if (qty - newShipped - cancelled < 0) {
        errors.push(`${p?.name||"商品"}: 出荷数量が受注数量(残${Math.max(0,qty-b.shipped-cancelled)})を超えています`);
      }
      // 未納数量 = 出荷済数量 - 納品済数量 - 返品数量 が0未満にならないこと
      if (newShipped - newDelivered - newReturned < 0) {
        errors.push(`${p?.name||"商品"}: 納品+返品数量が出荷済数量を超えています(未納数量がマイナスになります)`);
      }
      shipmentItems.push({transactionItemId: it.id, productId: it.productId, shippedQty: shipQty, deliveredQty: delivQty, returnedQty: retQty});
      newTotals[it.id] = {shipped: newShipped, cancelled};
    });
    if (shipmentItems.length===0) { alert("出荷/納品/返品のいずれかの数量を1件以上入力してください"); return; }
    if (errors.length) { alert("入力エラー:\n・"+errors.join("\n・")); return; }

    update(d=>{
      d.shipments = d.shipments || [];
      const now = new Date().toISOString();
      const isNew = !editingShipment;
      let shipmentRec, beforeShipment = null;
      if (isNew) {
        shipmentRec = {
          id: newId("ship"), shipmentNo: genShipmentNo(d.shipments, header.shipmentDate),
          transactionId: tx.id, shipmentDate: header.shipmentDate, plannedDeliveryDate: header.plannedDeliveryDate||null,
          actualDeliveryDate: header.actualDeliveryDate||null, originBase: header.originBase||null,
          deliveryDestinationId: header.deliveryDestinationId||null, carrier: header.carrier||"",
          trackingNo: header.trackingNo||"", deliveryMethod: header.deliveryMethod||"", items: shipmentItems,
          note: header.note||"", status: "shipped",
          createdBy: d.meta?.currentUserName||"", createdAt: now, updatedBy: d.meta?.currentUserName||"", updatedAt: now,
        };
        d.shipments = [...d.shipments, shipmentRec];
      } else {
        beforeShipment = d.shipments.find(s=>s.id===editingShipment.id);
        shipmentRec = {
          ...beforeShipment, shipmentDate: header.shipmentDate, plannedDeliveryDate: header.plannedDeliveryDate||null,
          actualDeliveryDate: header.actualDeliveryDate||null, originBase: header.originBase||null,
          deliveryDestinationId: header.deliveryDestinationId||null, carrier: header.carrier||"",
          trackingNo: header.trackingNo||"", deliveryMethod: header.deliveryMethod||"", items: shipmentItems,
          note: header.note||"", updatedBy: d.meta?.currentUserName||"", updatedAt: now,
        };
        d.shipments = d.shipments.map(s=>s.id===editingShipment.id?shipmentRec:s);
      }
      const freshTx = d.transactions.find(t=>t.id===tx.id);
      const recomputedTx = recomputeItemQtysFromShipments(freshTx, d.shipments);
      recomputedTx.status = computeTxStatus(recomputedTx);
      d.transactions = d.transactions.map(t=>t.id===tx.id?recomputedTx:t);
      d = addAuditLog(d, {action: isNew?"shipment_create":"shipment_update", targetType:"shipment", targetId:shipmentRec.id, before:beforeShipment, after:shipmentRec, reason:`取引${tx.transactionNo}`});

      // ---- Phase E: 出荷連動。stockMode==="stock"の明細については、出荷確定時にactiveな在庫引当を
      // 出荷数量ぶんだけ消込(fulfilled化、部分出荷は端数を残してactiveのまま継続)し、消込んだ数量ぶんの
      // sale_out在庫移動を自動作成する。引当が無い(または不足する)残数量分は、産地(出荷元倉庫)に
      // 対応する倉庫からの出庫として、引当を経由せず直接sale_out移動を作成する(在庫は必ず動かすが、
      // 「他の受注の引当」自体は変化しないので二重計上にはならない)。stockMode!=="stock"(取寄せ/直送)の
      // 明細は、そもそも自社倉庫の在庫を動かしていないため在庫移動を作らない。
      d.allocations = d.allocations || [];
      d.inventoryMovements = d.inventoryMovements || [];
      const nowMv = now;
      const originName = header.originBase || tx.sanchi || "";
      const originWarehouse = (d.warehouses||[]).find(w=>w.name===originName && w.active!==false) || (d.warehouses||[]).find(w=>w.active!==false);
      shipmentItems.forEach(si => {
        if (si.shippedQty<=0) return;
        const txItem = (freshTx.items||[]).find(x=>x.id===si.transactionItemId);
        if (!txItem || (txItem.stockMode||"stock")!=="stock") return; // 取寄せ/直送は在庫移動を作らない
        let remaining = si.shippedQty;
        const targetAllocs = d.allocations.filter(a=>a.transactionItemId===si.transactionItemId && a.status==="active")
          .sort((a,b)=>(a.createdAt||"").localeCompare(b.createdAt||""));
        const consumedAllocIds = {};
        targetAllocs.forEach(a=>{
          if (remaining<=0) return;
          const aQty = Number(a.qty||0);
          const take = Math.min(aQty, remaining);
          if (take<=0) return;
          remaining -= take;
          consumedAllocIds[a.id] = (consumedAllocIds[a.id]||0) + take;
          d.inventoryMovements.push({
            id: newId("mv"), timestamp: nowMv, productId: si.productId, warehouseId: a.warehouseId, lotId: a.lotId||null,
            inQty: 0, outQty: take, unit: "", sourceTransactionId: tx.id, sourceShipmentId: shipmentRec.id, sourcePurchaseId: null,
            movementType: "sale_out", reason: `出荷${shipmentRec.shipmentNo}による引当消込`, createdBy: d.meta?.currentUserName||"",
            createdAt: nowMv, cancelled: false, cancelReason: null,
          });
        });
        if (Object.keys(consumedAllocIds).length) {
          d.allocations = d.allocations.map(a=>{
            const take = consumedAllocIds[a.id];
            if (!take) return a;
            const remainQty = Number(a.qty||0) - take;
            if (remainQty > 0) {
              // 部分消込: 残数量はactiveのまま維持し、消込んだ分だけ新規のfulfilledレコードとして分割する
              return {...a, qty: remainQty};
            }
            return {...a, status:"fulfilled", releasedAt: nowMv};
          });
          Object.keys(consumedAllocIds).forEach(aid=>{
            const orig = targetAllocs.find(a=>a.id===aid);
            const take = consumedAllocIds[aid];
            if (orig && Number(orig.qty||0) - take > 0) {
              d.allocations.push({
                id: newId("alloc"), transactionId: orig.transactionId, transactionItemId: orig.transactionItemId,
                warehouseId: orig.warehouseId, lotId: orig.lotId, qty: take, status: "fulfilled",
                createdAt: orig.createdAt, releasedAt: nowMv, overrideReason: orig.overrideReason||null,
              });
            }
          });
          d = addAuditLog(d, {action:"stock_deallocate", targetType:"allocation", targetId:si.transactionItemId, before:null, after:consumedAllocIds, reason:`出荷${shipmentRec.shipmentNo}による引当消込(fulfilled化)`});
        }
        if (remaining > 0 && originWarehouse) {
          // 引当が存在しない(または不足する)残数量分は、引当を経由せず出荷元倉庫から直接出庫記録する
          d.inventoryMovements.push({
            id: newId("mv"), timestamp: nowMv, productId: si.productId, warehouseId: originWarehouse.id, lotId: null,
            inQty: 0, outQty: remaining, unit: "", sourceTransactionId: tx.id, sourceShipmentId: shipmentRec.id, sourcePurchaseId: null,
            movementType: "sale_out", reason: `出荷${shipmentRec.shipmentNo}(未引当分の出庫)`, createdBy: d.meta?.currentUserName||"",
            createdAt: nowMv, cancelled: false, cancelReason: null,
          });
        }
      });
      return d;
    });
    setEditingShipment(null);
    // cancelEdit()はdata prop更新前のtxを参照してしまい残数量の初期値がずれるため、
    // 直前に計算したnewTotals(保存後の実際の出荷済数量)から入力欄をリセットする。
    const resetInputs = {};
    (tx.items||[]).forEach(it=>{
      const t = newTotals[it.id];
      const shipped = t ? t.shipped : Number(it.shippedQty||0);
      const cancelled = t ? t.cancelled : Number(it.cancelledQty||0);
      const unshipped = Math.max(0, Number(it.qty||0)-shipped-cancelled);
      resetInputs[it.id] = {ship: unshipped>0?String(unshipped):"0", deliv:"0", ret:"0"};
    });
    setQtyInputs(resetInputs);
  };

  // ---- 納品書印刷: 対象shipmentレコードの各明細deliveredQty(=分納ならその回の実納品数量)だけから
  // スナップショットを作る。取引の受注数量やshippedQtyは一切参照しない。 ----
  const handlePrintDeliveryNote = (s) => {
    const {doc, isNew} = prepareDocument(data, {
      documentType:"delivery_note", sourceId: s.id, documentNo: s.shipmentNo,
      buildSnapshot: () => buildDeliveryNoteSnapshot(s, tx, data),
    });
    if (isNew) update(d => commitDocumentIssue(d, doc, `出荷${s.shipmentNo}`));
    setPrintDoc(doc);
  };

  const cancelShipment = (s) => {
    if (!confirm(`出荷 ${s.shipmentNo} を取消しますか？この出荷分の出荷/納品数量は取引明細から差し引かれます。`)) return;
    update(d=>{
      const before = s;
      const after = {...s, status:"cancelled", updatedBy: d.meta?.currentUserName||"", updatedAt: new Date().toISOString()};
      d.shipments = (d.shipments||[]).map(x=>x.id===s.id?after:x);
      const freshTx = d.transactions.find(t=>t.id===tx.id);
      const recomputedTx = recomputeItemQtysFromShipments(freshTx, d.shipments);
      recomputedTx.status = computeTxStatus(recomputedTx);
      d.transactions = d.transactions.map(t=>t.id===tx.id?recomputedTx:t);
      d = addAuditLog(d, {action:"shipment_cancel", targetType:"shipment", targetId:s.id, before, after, reason:`取引${tx.transactionNo}`});
      // ---- Phase E: 出荷取消に伴い、この出荷が作成した在庫移動(sale_out)を取消(cancelled:true)する。
      // 過去の入出庫履歴は物理削除・編集せず、cancelledフラグで在庫集計から除外するのみ(履歴自体は監査のため残す)。
      // 消込済(fulfilled)になっていた在庫引当そのものをactiveへ自動で戻す処理は本フェーズでは行わない(簡略化)。
      // stockOnHand()はcancelled除外で算出されるため、在庫数量自体は正しく元に戻る。
      d.inventoryMovements = (d.inventoryMovements||[]).map(m=>
        (m.sourceShipmentId===s.id && !m.cancelled) ? {...m, cancelled:true, cancelReason:`出荷取消(${s.shipmentNo})`} : m
      );
      return d;
    });
  };

  return (
    <div className="modal-bg" onClick={onClose}>
      <div className="modal" style={{width:820}} onClick={e=>e.stopPropagation()}>
        <h3>出荷/納品入力 - {tx.transactionNo} <span className={"badge badge-"+tx.status}>{({created:"納品予定",partial_delivered:"一部納品",delivered:"納品✓済",invoiced:"請求済"})[tx.status]||tx.status}</span></h3>
        <p style={{fontSize:11,color:"#666",marginBottom:8}}>💡 受注数量のうち今回出荷/納品/返品する数量だけを入力してください(複数回に分けて記録できます)。「今回出荷」は初期値として残数量が入っています。</p>

        <div style={{display:"grid",gridTemplateColumns:"1.4fr 55px 70px 70px 70px 70px 70px 70px 70px",gap:4,padding:"6px",fontSize:10,color:"#888",fontWeight:"bold"}}>
          <div>商品</div><div className="text-center">単位</div>
          <div className="text-center">受注</div><div className="text-center">出荷済</div><div className="text-center">納品済</div>
          <div className="text-center">今回出荷</div><div className="text-center">今回納品</div><div className="text-center">今回返品</div>
          <div className="text-center">状態</div>
        </div>
        {(tx.items||[]).map(it=>{
          const p = data.products.find(x=>x.id===it.productId);
          const inp = qtyInputs[it.id]||{ship:"0",deliv:"0",ret:"0"};
          return (
            <div key={it.id} style={{display:"grid",gridTemplateColumns:"1.4fr 55px 70px 70px 70px 70px 70px 70px 70px",gap:4,padding:"4px 6px",alignItems:"center",borderBottom:"1px solid #F0F0F0"}}>
              <div style={{fontSize:12}}>{p?.name||"?"}</div>
              <div className="text-center" style={{fontSize:11}}>{p?.unit||""}</div>
              <div className="text-center" style={{fontSize:11}}>{it.qty}</div>
              <div className="text-center" style={{fontSize:11}}>{it.shippedQty||0}</div>
              <div className="text-center" style={{fontSize:11}}>{it.deliveredQty||0}</div>
              <input type="number" step="0.01" value={inp.ship} onChange={e=>setQty(it.id,"ship",e.target.value)}/>
              <input type="number" step="0.01" value={inp.deliv} onChange={e=>setQty(it.id,"deliv",e.target.value)}/>
              <input type="number" step="0.01" value={inp.ret} onChange={e=>setQty(it.id,"ret",e.target.value)}/>
              <div className="text-center" style={{fontSize:10}}>{itemDeliveryStatus(it)}</div>
            </div>
          );
        })}

        <div className="grid-4" style={{marginTop:10}}>
          <div className="form-row"><label>出荷日 *</label><input type="date" value={header.shipmentDate} onChange={e=>setHeaderField("shipmentDate",e.target.value)}/></div>
          <div className="form-row"><label>納品予定日</label><input type="date" value={header.plannedDeliveryDate} onChange={e=>setHeaderField("plannedDeliveryDate",e.target.value)}/></div>
          <div className="form-row"><label>納品実績日</label><input type="date" value={header.actualDeliveryDate} onChange={e=>setHeaderField("actualDeliveryDate",e.target.value)}/></div>
          <div className="form-row"><label>出荷拠点(産地)</label>
            <select value={header.originBase} onChange={e=>setHeaderField("originBase",e.target.value)}><option>熊本</option><option>広島</option><option>その他</option></select>
          </div>
        </div>
        <div className="grid-4">
          <div className="form-row"><label>納品先</label>
            <select value={header.deliveryDestinationId} onChange={e=>setHeaderField("deliveryDestinationId",e.target.value)}>
              <option value="">(未指定)</option>
              {dests.map(dd=><option key={dd.id} value={dd.id}>{dd.name}</option>)}
            </select>
          </div>
          <div className="form-row"><label>運送業者</label><input value={header.carrier} onChange={e=>setHeaderField("carrier",e.target.value)}/></div>
          <div className="form-row"><label>伝票/追跡番号</label><input value={header.trackingNo} onChange={e=>setHeaderField("trackingNo",e.target.value)}/></div>
          <div className="form-row"><label>配送方法</label><input value={header.deliveryMethod} onChange={e=>setHeaderField("deliveryMethod",e.target.value)}/></div>
        </div>
        <div className="form-row"><label>備考</label><input value={header.note} onChange={e=>setHeaderField("note",e.target.value)}/></div>

        <div className="flex" style={{justifyContent:"flex-end",marginTop:10,gap:8}}>
          {editingShipment && <button className="btn btn-secondary" onClick={cancelEdit}>編集をやめる</button>}
          <button className="btn btn-primary" onClick={doSave}>{editingShipment?"この出荷を更新":"この内容で出荷/納品を記録"}</button>
        </div>

        <div style={{marginTop:16,borderTop:"1px solid #DDE6F0",paddingTop:10}}>
          <strong>この取引の出荷/納品履歴 ({myShipments.length}件)</strong>
          {myShipments.length===0 && <p style={{fontSize:11,color:"#999"}}>まだ出荷/納品の記録はありません</p>}
          {myShipments.length>0 && (
            <table style={{marginTop:6}}>
              <thead><tr><th>出荷No.</th><th>出荷日</th><th>運送業者</th><th>追跡番号</th><th className="text-right">出荷数量計</th><th className="text-right">納品数量計</th><th>状態</th><th></th></tr></thead>
              <tbody>
                {myShipments.map(s=>{
                  const sumShip = (s.items||[]).reduce((a,x)=>a+(Number(x.shippedQty)||0),0);
                  const sumDeliv = (s.items||[]).reduce((a,x)=>a+(Number(x.deliveredQty)||0),0);
                  return <tr key={s.id}>
                    <td>{s.shipmentNo}</td>
                    <td>{fmtDate(s.shipmentDate)}</td>
                    <td>{s.carrier||"-"}</td>
                    <td>{s.trackingNo||"-"}</td>
                    <td className="text-right">{sumShip}</td>
                    <td className="text-right">{sumDeliv}</td>
                    <td>{s.status==="cancelled" ? <span className="badge badge-nouyaku">取消済</span> : <span className="badge badge-delivered">有効</span>}</td>
                    <td>
                      {s.status!=="cancelled" && <>
                        <button className="btn btn-secondary btn-sm" onClick={()=>startEdit(s)}>編集</button>
                        <button className="btn btn-secondary btn-sm" style={{marginLeft:4}} onClick={()=>handlePrintDeliveryNote(s)}>納品書印刷</button>
                        <button className="btn btn-danger btn-sm" style={{marginLeft:4}} onClick={()=>cancelShipment(s)}>取消</button>
                      </>}
                    </td>
                  </tr>;
                })}
              </tbody>
            </table>
          )}
        </div>

        <div className="flex" style={{justifyContent:"flex-end",marginTop:14}}>
          <button className="btn btn-secondary" onClick={onClose}>閉じる</button>
        </div>
      </div>
      {printDoc && <DocumentPrintView doc={printDoc} update={update} onClose={()=>setPrintDoc(null)}/>}
    </div>
  );
}

// ================================================================
// 請求タブ (取引明細の「納品済かつ未請求」数量を月別×お客様別集計。Phase Bで数量ベースに変更)
// ================================================================
// 対象取引tの明細のうち、取引先partnerの請求サイクル設定に基づく請求可能行(billable line)を組み立てる。
// 各行は「今回請求する数量(qty)」単位の金額まで持ち、freee送信/請求書レコード保存の両方で共通利用する。
function buildBillableLines(t, partner, products) {
  const billable = billableItemsFor(t, partner);
  return billable.map(it => {
    const p = products.find(x=>x.id===it.productId);
    const unitPrice = Number(it.salePrice)||0;
    const qty = it.billableQty;
    const amount = qty * unitPrice;
    const rate = (p?.taxRate===0.08) ? 0.08 : 0.10;
    return {
      transactionId: t.id, transactionItemId: it.id, productId: it.productId,
      productName: p?.name||"?", unit: p?.unit||"",
      qty, unitPrice, amount, taxRate: rate,
      transactionNo: t.transactionNo, transactionDate: t.transactionDate, sanchi: t.sanchi,
    };
  });
}

function InvoicingTab({data,update,freeeConfig,onNeedConfig}){
  const [selectedMonth,setSelectedMonth] = useState(new Date().toISOString().slice(0,7));
  const [customerFilter,setCustomerFilter] = useState("");
  const [sending,setSending] = useState(false); // 二重クリック防止
  const [preview,setPreview] = useState(null); // {customerId, lines, tax8, tax10, total}
  const [cancelTarget,setCancelTarget] = useState(null); // invoice
  const [cancelling,setCancelling] = useState(false); // 二重クリック防止(請求取消)
  const [freeeConfirmTarget,setFreeeConfirmTarget] = useState(null); // freee側手動取消の確認対象invoice
  const [confirming,setConfirming] = useState(false); // 二重クリック防止(freee側取消確認)

  // freee側手動取消待ちの請求(全期間対象。月フィルタに関係なく常に見えるようにする)
  const pendingManualInvoices = (data.invoices||[]).filter(i=>i.freeeCancelStatus==="pending_manual");

  // 請求対象は status が delivered/partial_delivered (納品が一部でも進んでいる)取引のみ。
  // invoiced済(完全に請求し尽くした取引)やcreated(未着手)・cancelledは対象外。
  const candidateTxs = (data.transactions||[]).filter(t => {
    if (t.status !== "delivered" && t.status !== "partial_delivered") return false;
    const c = data.partners.find(p=>p.id===t.customerId);
    if (!c) return false;
    if (!inBillingPeriod(t, c, selectedMonth)) return false;
    if (customerFilter && t.customerId!==customerFilter) return false;
    return true;
  });

  const byCust = {};
  candidateTxs.forEach(t => {
    const c = data.partners.find(p=>p.id===t.customerId);
    const lines = buildBillableLines(t, c, data.products);
    if (lines.length===0) return; // 請求サイクル的にまだ請求可能数量が無い(afterFullDeliveryで未完納 等)
    byCust[t.customerId] = byCust[t.customerId] || {lines:[],total:0,tax8:0,tax10:0};
    lines.forEach(line=>{
      byCust[t.customerId].lines.push(line);
      byCust[t.customerId].total += line.amount;
      if (line.taxRate===0.08) byCust[t.customerId].tax8 += line.amount;
      else byCust[t.customerId].tax10 += line.amount;
    });
  });

  // 同月・同客先で発行済(issued/reissued)のinvoice一覧(参考表示・取消用)
  const monthInvoices = (data.invoices||[]).filter(inv =>
    inv.targetMonth===selectedMonth &&
    (customerFilter ? inv.customerId===customerFilter : true) &&
    inv.status !== "cancelled"
  );

  const openPreview = (customerId, g) => {
    if (!freeeConfig?.accessToken || !freeeConfig?.companyId) {
      if (confirm("freee設定が未登録です。設定画面を開きますか?")) onNeedConfig();
      return;
    }
    const totalTax = Math.floor(g.tax8*0.08) + Math.floor(g.tax10*0.10);
    setPreview({customerId, lines:g.lines, tax8:g.tax8, tax10:g.tax10, totalTax, total:g.total});
  };

  const doFreeeIssue = async () => {
    if (!preview || sending) return;
    setSending(true);
    try {
      await confirmFreeeIssue(freeeConfig, {customerId:preview.customerId, lines:preview.lines, month:selectedMonth});
    } finally {
      setSending(false);
    }
  };

  const confirmFreeeIssue = async (config, target) => {
    const customer = data.partners.find(p=>p.id===target.customerId);
    if (!customer) { alert("お客様が見つかりません"); return; }
    if (!target.lines || target.lines.length === 0) { alert("請求対象の明細がありません(既に請求済の可能性があります)"); setPreview(null); return; }

    const invoiceItems = [];
    let subtotalByTaxRate = {"0.08":0, "0.10":0};
    target.lines.forEach(line => {
      const mmdd = new Date(line.transactionDate);
      const dateStr = (mmdd.getMonth()+1)+"/"+mmdd.getDate();
      const rate = line.taxRate===0.08 ? "0.08" : "0.10";
      subtotalByTaxRate[rate] += line.amount;
      invoiceItems.push({
        type: "normal",
        description: dateStr + "納品 " + line.productName + (line.sanchi ? " "+line.sanchi+"分" : ""),
        qty: line.qty,
        unit: line.unit,
        unit_price: line.unitPrice,
        vat: (line.taxRate===0.08) ? "eight_percent_as_reduced_tax_rate" : "ten_percent"
      });
    });
    const taxByTaxRate = {
      "0.08": Math.floor(subtotalByTaxRate["0.08"]*0.08),
      "0.10": Math.floor(subtotalByTaxRate["0.10"]*0.10)
    };
    const total = subtotalByTaxRate["0.08"]+subtotalByTaxRate["0.10"]+taxByTaxRate["0.08"]+taxByTaxRate["0.10"];

    const lastDay = new Date(target.month+"-01");
    lastDay.setMonth(lastDay.getMonth()+1);
    lastDay.setDate(0);
    const issueDate = lastDay.toISOString().slice(0,10);
    const dueDate = calcDueDate(customer, issueDate);

    const body = {
      company_id: Number(config.companyId),
      issue_date: issueDate,
      due_date: dueDate,
      partner_id: Number(customer.freeePartnerId || 0) || null,
      partner_code: customer.formalName || customer.name,
      invoice_status: "issue",
      title: target.month.replace("-","年")+"月分",
      invoice_contents: invoiceItems
    };
    if (!body.partner_id && !body.partner_code) {
      alert("お客様のfreee partner_idまたは正式社名が必要です");
      return;
    }
    if (!body.partner_id) delete body.partner_id;
    else delete body.partner_code;

    const invoiceId = newId("inv");
    const invoiceNo = genInvoiceNo(data.invoices, customer, target.month);
    const txIdsPreview = [...new Set(target.lines.map(l=>l.transactionId))];

    try {
      const res = await fetch("https://api.freee.co.jp/api/1/invoices", {
        method: "POST",
        headers: {
          "Authorization": "Bearer " + config.accessToken,
          "Content-Type": "application/json",
          "X-Api-Version": "2020-06-15"
        },
        body: JSON.stringify(body)
      });
      const j = await res.json();
      if (!res.ok) {
        const msg = JSON.stringify(j).substring(0,400);
        alert("freee APIエラー: " + msg);
        await update(d=>{
          d.freeeErrorLog = d.freeeErrorLog || [];
          d.freeeErrorLog.push({id:newId("err"), timestamp:new Date().toISOString(), customerId:target.customerId, month:target.month, error:msg, retryable:true});
          return d;
        });
        return;
      }
      const freeeInvoiceId = j.invoice?.id;
      const now = new Date().toISOString();
      await update(d=>{
        // 二重請求防止の要: freee送信内容(target.lines)は請求書発行"内容"の記録用に使うが、
        // 実際にinvoicedQtyへ加算する量は必ずここでd(最新state)を再取得して算出し直す。
        // billed = 常に「その時点のdeliveredQty - invoicedQty」ぴったりの量になるため、
        // 何度呼ばれても invoicedQty は deliveredQty を超えて積み上がることは構造的にあり得ない。
        const invoiceLineItems = [];
        d.transactions = d.transactions.map(t=>{
          if (!txIdsPreview.includes(t.id)) return t;
          const freshLines = buildBillableLines(t, customer, d.products);
          if (freshLines.length===0) return t;
          const items = t.items.map(it=>{
            const fl = freshLines.find(l=>l.transactionItemId===it.id);
            if (!fl) return it;
            invoiceLineItems.push({
              transactionId: t.id, transactionItemId: it.id, productId: it.productId,
              billedQty: fl.qty, unitPrice: fl.unitPrice, amount: fl.amount, taxRate: fl.taxRate,
            });
            return {...it, invoicedQty: Number(it.invoicedQty||0) + fl.qty};
          });
          const newTx = {...t, items};
          newTx.status = computeTxStatus(newTx);
          if (newTx.status === "invoiced") {
            newTx.invoiceId = invoiceId; newTx.invoiceNo = invoiceNo; newTx.invoicedAt = now;
            newTx.invoicedYearMonth = target.month; newTx.invoicedDate = today(); newTx.freeeInvoiceId = freeeInvoiceId;
          }
          return newTx;
        });
        const txIds = [...new Set(invoiceLineItems.map(l=>l.transactionId))];
        d.invoices = d.invoices || [];
        // 取消済のいずれかの請求と対象取引が重複する場合は「再発行」として元請求に紐づける
        const original = d.invoices.filter(i=>i.status==="cancelled" && i.txIds.some(id=>txIds.includes(id)))
          .sort((a,b)=>new Date(b.cancelledAt)-new Date(a.cancelledAt))[0] || null;
        d.invoices.push({
          id: invoiceId, invoiceNo, customerId: target.customerId, targetMonth: target.month,
          txIds, items: invoiceLineItems, issuedAt: now, status: original ? "reissued" : "issued",
          subtotalByTaxRate, taxByTaxRate, total,
          cancelReason: null, cancelledAt: null, cancelledBy: null,
          originalInvoiceId: original ? original.id : null, freeeInvoiceId, freeeSentAt: now,
          // Phase C: freee送信/取消ステータス管理用フィールド。この時点でfreeeへの送信自体は成功しているためsent。
          freeeSendStatus: "sent", freeeCancelStatus: "not_applicable",
          freeeCancelledAt: null, freeeCancelledBy: null, freeeCancelError: null, retryable: false, lastSyncedAt: null,
        });
        d = addAuditLog(d, {action:"invoice_issue", targetType:"invoice", targetId:invoiceId, before:null, after:{invoiceNo, customerId:target.customerId, txIds, total}});
        return d;
      });
      alert("freeeに請求書を作成しました (請求No: "+invoiceNo+" / freee ID: "+freeeInvoiceId+")");
      setPreview(null);
    } catch(err) {
      alert("接続エラー: "+err.message+"\n\nCORSブロックの可能性があります。GAS経由の代替案が必要かもしれません。");
      await update(d=>{
        d.freeeErrorLog = d.freeeErrorLog || [];
        d.freeeErrorLog.push({id:newId("err"), timestamp:new Date().toISOString(), customerId:target.customerId, month:target.month, error:String(err.message||err), retryable:true});
        return d;
      });
    }
  };

  const cancelInvoice = (invoice, reason) => {
    if (cancelling) return; // 連打によるレースコンディション(取消の二重記録)防止
    // freeeへ送信済みの請求の場合、アプリ内取消だけではfreee側の請求書は残ったままになる旨を
    // 明示的に警告する(ユーザー指示: 「アプリ内で請求を取り消しても、freee側に請求書が残る可能性がある」への対応)。
    // freee Invoice APIの自動取消/削除エンドポイントは本アプリのCORS制約下で安全性を確認できないため、
    // ここでは見せかけの自動取消は行わず、手動確認フロー(下のconfirmFreeeCancelled)へ誘導する。
    if (invoice.freeeInvoiceId) {
      const ok = confirm(
        "この請求はfreeeへ送信済みです(freee ID: "+invoice.freeeInvoiceId+")。\n"+
        "アプリ内で取消しても、freee側の請求書はそのまま残ります。\n"+
        "freee側でも手動で取消処理を行う必要があります。\n\n"+
        "続行しますか？"
      );
      if (!ok) return;
    }
    setCancelling(true);
    update(d=>{
      // 二重取消防止: 呼び出し元のstate(invoice)は信用せず、d内の最新状態を再確認してから取消する
      const current = (d.invoices||[]).find(i=>i.id===invoice.id);
      if (!current) { alert("請求が見つかりません"); return d; }
      if (current.status === "cancelled") { alert("この請求は既に取消済みです(二重取消を防止しました)"); return d; }
      const before = current;
      const after = {
        ...current, status:"cancelled", cancelReason:reason, cancelledAt:new Date().toISOString(), cancelledBy: d.meta?.currentUserName||"",
        freeeCancelStatus: current.freeeInvoiceId ? "pending_manual" : (current.freeeCancelStatus || "not_applicable"),
      };
      d.invoices = (d.invoices||[]).map(i=>i.id===current.id?after:i);
      // 紐づく取引の各明細から、この請求で加算した分(billedQty)だけを正確に差し引く(物理削除はしない)。
      // 旧仕様(v3以前に発行された、明細内訳items[]を持たない請求)を取消す場合は、後方互換として
      // 従来通りtxを丸ごとdeliveredへ戻す(invoicedQtyの精緻な巻き戻しはできないため保守的に据え置く)。
      const lineItems = current.items || [];
      d.transactions = (d.transactions||[]).map(t=>{
        if (!current.txIds.includes(t.id)) return t;
        if (lineItems.length === 0) {
          // 旧仕様の請求(明細内訳なし): 全体をdeliveredへ戻す
          return {...t, status:"delivered", invoiceId:null, invoiceNo:null, invoicedAt:null};
        }
        const mine = lineItems.filter(li=>li.transactionId===t.id);
        if (mine.length===0) return t;
        const items = t.items.map(it=>{
          const li = mine.find(x=>x.transactionItemId===it.id);
          if (!li) return it;
          return {...it, invoicedQty: Math.max(0, Number(it.invoicedQty||0) - Number(li.billedQty||0))};
        });
        const newTx = {...t, items};
        newTx.status = computeTxStatus(newTx);
        if (newTx.status !== "invoiced") { newTx.invoiceId = null; newTx.invoiceNo = null; newTx.invoicedAt = null; }
        return newTx;
      });
      d = addAuditLog(d, {action:"invoice_cancel", targetType:"invoice", targetId:current.id, before, after, reason});
      return d;
    });
    setCancelling(false);
    setCancelTarget(null);
  };

  // freee側で手動取消を確認済みにする(state machineをconfirmed_cancelledへ遷移)
  const confirmFreeeCancelled = (invoice) => {
    if (confirming) return; // 連打防止
    setConfirming(true);
    update(d=>{
      const current = (d.invoices||[]).find(i=>i.id===invoice.id);
      if (!current) { alert("請求が見つかりません"); return d; }
      if (current.freeeCancelStatus !== "pending_manual") { alert("この請求は既に処理済みです(二重確認を防止しました)"); return d; }
      const before = current;
      const now = new Date().toISOString();
      const after = {
        ...current, freeeCancelStatus:"confirmed_cancelled",
        freeeCancelledAt: now, freeeCancelledBy: d.meta?.currentUserName||"",
      };
      d.invoices = (d.invoices||[]).map(i=>i.id===current.id?after:i);
      d = addAuditLog(d, {action:"freee_cancel_confirm", targetType:"invoice", targetId:current.id, before, after, reason:"freee側での手動取消をユーザーが確認"});
      return d;
    });
    setConfirming(false);
    setFreeeConfirmTarget(null);
  };

  // freee側取消が失敗した場合の記録用エスケープハッチ(自動リトライ機構自体は本フェーズ対象外)
  const markFreeeCancelFailed = (invoice) => {
    const msg = prompt("freee側取消の失敗理由を入力してください(このメモは後で再試行する際の参考として保存されます):", invoice.freeeCancelError||"");
    if (msg === null) return; // キャンセル
    update(d=>{
      const current = (d.invoices||[]).find(i=>i.id===invoice.id);
      if (!current) return d;
      const before = current;
      const after = {...current, freeeCancelStatus:"cancel_failed", freeeCancelError: msg, retryable: true};
      d.invoices = (d.invoices||[]).map(i=>i.id===current.id?after:i);
      d = addAuditLog(d, {action:"freee_cancel_failed", targetType:"invoice", targetId:current.id, before, after, reason:"freee側取消の失敗を手動記録"});
      return d;
    });
  };

  return (<>
    <div className="card">
      <h2>月次請求プレビュー ({selectedMonth}分)</h2>
      <div className="flex" style={{marginBottom:12}}>
        <label>対象月:</label>
        <input type="month" value={selectedMonth} onChange={e=>setSelectedMonth(e.target.value)}/>
        <label>お客様:</label>
        <select value={customerFilter} onChange={e=>setCustomerFilter(e.target.value)}>
          <option value="">全て</option>
          {data.partners.filter(p=>p.type==="customer").map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
        </select>
      </div>
      <p style={{fontSize:12,color:"#666",marginBottom:10}}>💡 対象は「納品済かつ未請求」の数量のみ(明細単位で判定)。取引先ごとの請求サイクル設定(全数納品後一括 / 分納ごと)と締め日設定に基づき、請求基準日(納品日/出荷日/検収日/取引日)が対象期間に入るものだけを集計します。「請求書発行」を押すとプレビュー確認の上、該当数量が請求済になります(取引全体が編集不可になるのは、その取引の全数量を請求し終えた時のみです)。</p>
      {Object.keys(byCust).length === 0 && <p style={{color:"#999",padding:20}}>対象期間に納品済(未請求)の数量がありません</p>}
      {Object.keys(byCust).map(id=>{
        const c = data.partners.find(p=>p.id===id);
        const g = byCust[id];
        const totalTax = Math.floor(g.tax8*0.08) + Math.floor(g.tax10*0.10);
        const {start,end} = billingPeriodFor(c, selectedMonth);
        const cadenceLabel = (c?.billingCadence||"afterFullDelivery")==="perShipment" ? "分納ごとに請求" : "全数納品後に一括請求";
        return (
          <div key={id} style={{marginBottom:16,border:"1px solid #DDE6F0",borderRadius:6,padding:12}}>
            <div className="flex-between" style={{marginBottom:8}}>
              <strong>{c?.name} ({c?.kind}) - {g.lines.length}明細 [請求基準: {({delivery:"納品日",shipping:"出荷日",inspection:"検収日",transaction:"取引日"})[c?.invoiceBasis||"delivery"]} / {cadenceLabel} / 期間: {c?.billingCadence==="perShipment"?"都度":`${start}〜${end}`}]</strong>
              <div className="flex">
                <span className="price" style={{fontSize:14}}>税抜: {yen(g.total)}</span>
                <span style={{fontSize:12,color:"#888"}}>消費税: ¥{totalTax.toLocaleString()}</span>
                <span className="price" style={{fontSize:16}}>税込: {yen(g.total+totalTax)}</span>
                <button className="btn btn-primary btn-sm" onClick={()=>openPreview(id, g)}>請求書発行(freee)</button>
              </div>
            </div>
            <table>
              <thead><tr><th>取引日</th><th>取引No.</th><th>産地</th><th>品目</th><th className="text-right">請求数量</th><th className="text-right">請求金額</th></tr></thead>
              <tbody>
                {g.lines.map((line,i)=><tr key={i}>
                  <td>{fmtDate(line.transactionDate)}</td>
                  <td>{line.transactionNo}</td>
                  <td>{line.sanchi}</td>

    {preview && (

            <div className="item"><div className="lbl">税抜合計</div><div className="val">{yen(preview.total)}</div></div>
