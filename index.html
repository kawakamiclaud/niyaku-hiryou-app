    // 旧データにはそもそも納品先の概念が存在しなかったため、自動推測はせずnullで補完するのみ。
    if (nt.deliveryDestinationId === undefined) nt.deliveryDestinationId = null;
    if (nt.sanchiOther === undefined) nt.sanchiOther = null;

    nt.items = nt.items.map(it => ({
      ...it,
      id: it.id || newId("txit"),
      shippedQty: it.shippedQty ?? 0,
      deliveredQty: it.deliveredQty ?? 0,
      returnedQty: it.returnedQty ?? 0,
      cancelledQty: it.cancelledQty ?? 0,

  d.invoices = (d.invoices || []).map(inv => ({
    ...inv,
    freeeSendStatus: inv.freeeSendStatus !== undefined ? inv.freeeSendStatus : (inv.freeeInvoiceId ? "sent" : "not_sent"),

  // オブジェクト自体が無ければ空オブジェクトで補完するのみ(各フィールドの既定値は読み取り側で""として扱う)。
  // documentsは既存データには存在しない全く新しい配列なので、非破壊的に空配列で初期化するのみ。
  if (fromVersion < 6) {
    d.meta.companySettings = d.meta.companySettings || {};

    d.meta.companySettings = d.meta.companySettings || {};
    d.documents = d.documents || [];
  }
  // ---- v7マイグレーション(Phase E 1-3): 在庫管理(倉庫/入出庫履歴/ロット/引当)の新規追加。

  // 非破壊的に空配列で初期化するのみ(倉庫マスタのみ、空の場合に熊本/広島の初期2拠点をシードする)。
  // 在庫数量そのものは直接編集可能な数値フィールドとして持たせず、常にinventoryMovementsの積み上げ(stockOnHand)
  // から算出する方式のため、ここではマスタ配列の器を用意するだけでよい。
  // products[].lotManaged / transactions[].items[].stockMode は既存レコードへの非破壊的な追記(??で欠損時のみ補完)。
  // meta.lotExpiryThresholdDays(ロット期限間近アラート基準日数)は未設定時のみ既定値30日を補完する。
  if (fromVersion < 7) {
    d.warehouses = (d.warehouses && d.warehouses.length) ? d.warehouses : [
      {id: newId("wh"), name: "熊本", active: true, note: ""},
      {id: newId("wh"), name: "広島", active: true, note: ""},
    ];
    d.inventoryMovements = d.inventoryMovements || [];
    d.lots = d.lots || [];
    d.allocations = d.allocations || [];
    d.products = (d.products || []).map(p => ({...p, lotManaged: p.lotManaged ?? false}));
    d.transactions = (d.transactions || []).map(t => ({
      ...t,
      items: (t.items || []).map(it => ({...it, stockMode: it.stockMode || "stock"})),
    }));
    if (d.meta.lotExpiryThresholdDays === undefined || d.meta.lotExpiryThresholdDays === null) {

    }
    d.meta.migratedAtV7 = new Date().toISOString();
  } else {
    d.warehouses = d.warehouses || [];
    d.inventoryMovements = d.inventoryMovements || [];
    d.lots = d.lots || [];
    d.allocations = d.allocations || [];
    d.products = (d.products || []).map(p => ({...p, lotManaged: p.lotManaged ?? false}));
    d.transactions = (d.transactions || []).map(t => ({
      ...t,
      items: (t.items || []).map(it => ({...it, stockMode: it.stockMode || "stock"})),
    }));
    if (d.meta.lotExpiryThresholdDays === undefined || d.meta.lotExpiryThresholdDays === null) {
      d.meta.lotExpiryThresholdDays = 30;
    }
  }
  // ---- v8マイグレーション(Phase F): 入金・消込(payments)の新規追加 ----
  // 既存データに存在しない全く新しい配列なので、非破壊的に空配列で初期化するのみ。
  // 請求残高/入金ステータスはpayments配列を単一の情報源として都度算出する方式のため、
  // 既存のtransactions/invoicesレコード側には一切フィールドを追加しない。
  if (fromVersion < 8) {
    d.payments = d.payments || [];

  } else {
    d.payments = d.payments || [];
  }
  d.meta.schemaVersion = SCHEMA_VERSION;
  return d;
}

const uuid = (prefix="id") => prefix+"-"+Date.now().toString(36)+Math.random().toString(36).substring(2,6);

// ---- 在庫の唯一の算出方法: 指定商品×倉庫(×ロット)の現在庫を、取消されていない入出庫履歴の積み上げから算出する。
// 在庫数量を直接編集可能なフィールドとして持たず、常にこの関数を単一の情報源として使う(ダッシュボード/引当ロジック等、他のUIも必ずこれを呼ぶこと)。
function stockOnHand(inventoryMovements, productId, warehouseId, lotId) {
  return (inventoryMovements || []).reduce((sum, m) => {
    if (m.cancelled) return sum;
    if (m.productId !== productId) return sum;
    if (warehouseId !== undefined && warehouseId !== null && m.warehouseId !== warehouseId) return sum;
    if (lotId !== undefined && lotId !== null && m.lotId !== lotId) return sum;
    return sum + Number(m.inQty || 0) - Number(m.outQty || 0);
  }, 0);
}
// ---- 指定商品×倉庫(×ロット)に対する「他の受注からの引当済み(active)」数量の合計。
// allocationsレコード自体はproductIdを持たないため、transactionItemId経由でtransactions[].items[]を辿って商品を特定する。
function allocatedQtyFor(data, productId, warehouseId, lotId) {
  return (data.allocations||[]).reduce((sum,a)=>{
    if (a.status!=="active") return sum;
    if (warehouseId!==undefined && warehouseId!==null && a.warehouseId!==warehouseId) return sum;
    if (lotId!==undefined && lotId!==null && a.lotId!==lotId) return sum;
    const tx = (data.transactions||[]).find(t=>t.id===a.transactionId);
    const it = tx && (tx.items||[]).find(x=>x.id===a.transactionItemId);
    if (!it || it.productId!==productId) return sum;
    return sum + Number(a.qty||0);
  }, 0);
}
// ---- 指定ロットの現在数量。lots[].receivedQtyは初期入荷数量の参考値であり、現在数量として使ってはならない
// (レコードとして直接編集可能な数値フィールドを持たせない方針のため、常にinventoryMovementsから算出する)。
function currentLotQty(inventoryMovements, lotId) {
  return (inventoryMovements || []).reduce((sum, m) => {
    if (m.cancelled) return sum;
    if (m.lotId !== lotId) return sum;
    return sum + Number(m.inQty || 0) - Number(m.outQty || 0);
  }, 0);
}
// ---- ロットの表示ステータスをexpiryDateと基準日から自動算出する。
// ただしstopped/recalled/disposed/sold_outは手動での上書きステータスとして日付判定より優先する。
function computeLotStatus(lot, todayStr, expiryThresholdDays) {
  if (!lot) return "available";
  if (["stopped","recalled","disposed","sold_out"].includes(lot.status)) return lot.status;
  if (!lot.expiryDate) return "available";
  const t = new Date(todayStr);
  const e = new Date(lot.expiryDate);
  const diffDays = Math.floor((e - t) / (1000*60*60*24));
  if (diffDays < 0) return "expired";
  if (diffDays <= Number(expiryThresholdDays ?? 30)) return "expiring_soon";
  return "available";
}

// ---- マスタ削除ガード: そのIDが取引/請求で使われていれば true ----
function isReferenced(data, type, id) {
  const txs = data.transactions || [];
  const invoices = data.invoices || [];
  if (type === "product") {
    return txs.some(t => (t.items||[]).some(it => it.productId === id));
  }
  if (type === "partner") {
    return txs.some(t => t.customerId === id || t.supplierId === id || (t.items||[]).some(it=>it.supplierId===id))
      || invoices.some(inv => inv.customerId === id);
  }
  return false;
}

// ---- 単価マスタ: 同一取引先×商品×産地×売買種別で適用期間が重複する既存単価を探す ----
function findOverlappingPrice(prices, price) {
  const s = new Date(price.startDate);
  const e = price.endDate ? new Date(price.endDate) : null;
  return (prices||[]).find(p => {
    if (p.id && price.id && p.id === price.id) return false;
    if (p.partnerId !== price.partnerId || p.productId !== price.productId ||
        p.sanchi !== price.sanchi || p.priceType !== price.priceType) return false;
    const ps = new Date(p.startDate);
    const pe = p.endDate ? new Date(p.endDate) : null;
    if (e && ps > e) return false; // 既存が新規の終了後に開始 → 重複なし
    if (pe && pe < s) return false; // 既存が新規の開始前に終了 → 重複なし
    return true;
  }) || null;
}

  const paymentDay = partner?.paymentDay ?? "月末";
  const [iy, im] = issueDateStr.split("-").map(Number); // im は1始まり
  let ty = iy, tm = (im - 1) + paymentMonthOffset; // tmは0始まりの一時計算用
  while (tm < 0) { tm += 12; ty -= 1; }
  while (tm > 11) { tm -= 12; ty += 1; }
  let day;
  if (paymentDay === "月末" || paymentDay == null || paymentDay === "") {
    // getDate()はローカルの日付フィールドを読むだけなのでtoISOStringのようなTZずれは起きない
    day = new Date(ty, tm+1, 0).getDate();
  } else {
    day = Number(paymentDay);
  }
  return `${ty}-${String(tm+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
}

// ---- 請求基準日: 取引先のinvoiceBasisに応じてどの日付で月判定するか ----
function invoiceBasisDate(t, basis) {
  switch(basis) {
    case "shipping": return t.actualShipDate || t.shippedDate || t.transactionDate;
    case "inspection": return t.inspectionDate || t.transactionDate;
    case "transaction": return t.transactionDate || t.orderDate;
    case "delivery":
    default: return t.deliveredDate || t.transactionDate;
  }
}

// ---- 請求書番号採番: INV-YYYYMM-取引先コード-連番 ----
function genInvoiceNo(invoices, customer, targetMonth) {
  const ym = targetMonth.replace("-","");
  const code = (customer?.id || "XXXX").replace(/[^a-zA-Z0-9]/g,"").slice(-4).toUpperCase() || "XXXX";
  const prefix = `INV-${ym}-${code}-`;
  const existing = (invoices||[]).filter(i => i.invoiceNo && i.invoiceNo.startsWith(prefix));
  const seq = existing.length + 1;
  return `${prefix}${String(seq).padStart(3,"0")}`;
}

function itemSummary(items, products) {
  if (!items || items.length === 0) return "-";
  const names = items.map(it => {
    const p = products.find(x => x.id === it.productId);
    return p ? p.name : "?";
  });
  if (names.length <= 2) return names.join("、");
  return names.slice(0,2).join("、") + " 他" + (names.length-2) + "品";
}

function findPrice(prices, partnerId, productId, sanchi, date, priceType) {
  const dt = new Date(date);
  const matched = (prices||[]).filter(p =>
    p.partnerId === partnerId &&
    p.productId === productId &&
    p.sanchi === sanchi &&
    (!priceType || p.priceType === priceType) &&
    new Date(p.startDate) <= dt &&
    (!p.endDate || new Date(p.endDate) >= dt)
  );
  matched.sort((a,b) => new Date(b.startDate) - new Date(a.startDate));
  return matched[0] || null;
}

// ---- 見積番号採番: EST-YYYYMM-NNNN (4桁, その年月内でグローバル連番) ----
// 取消・削除された見積番号も再利用しない(常に既存の最大連番+1を使う。配列長ではない)。
function genQuotationNo(quotations, dateStr) {
  const ym = (dateStr || today()).replace(/-/g,"").slice(0,6);
  const prefix = `EST-${ym}-`;
  let maxSeq = 0;
  (quotations||[]).forEach(q => {
    if (q.quotationNo && q.quotationNo.startsWith(prefix)) {
      const n = parseInt(q.quotationNo.slice(prefix.length), 10);
      if (!isNaN(n) && n > maxSeq) maxSeq = n;
    }
  });
  return `${prefix}${String(maxSeq+1).padStart(4,"0")}`;
}

function validateQuotation(q) {
  const errors = [];
  if (!q.customerId) errors.push("販売先を選択してください");
  if (!q.items || q.items.length === 0) errors.push("明細を1件以上追加してください");
  (q.items||[]).forEach((it,i)=>{
    if (!(Number(it.qty) > 0)) errors.push(`明細${i+1}: 数量は0より大きい値を入力してください`);
    if (Number(it.salePrice) < 0) errors.push(`明細${i+1}: 販売単価にマイナスは入力できません`);
  });
  if (!q.quotationDate) errors.push("見積日を入力してください");
  return errors;
}

// ---- 見積の税率別集計(InvoicingTab/confirmFreeeIssueと同じ考え方で税率ごとに小計・消費税を分けて計算) ----
function computeQuotationTotals(q, products) {
  const items = q.items || [];
  const subtotalByTaxRate = {"0.08":0, "0.10":0};
  items.forEach(it => {
    const rate = Number(it.taxRate)===0.08 ? "0.08" : "0.10";
    const amt = Number(it.qty||0)*Number(it.salePrice||0) - Number(it.discountAmount||0);
    subtotalByTaxRate[rate] += amt;
  });
  const taxByTaxRate = {
    "0.08": Math.floor(subtotalByTaxRate["0.08"]*0.08),
    "0.10": Math.floor(subtotalByTaxRate["0.10"]*0.10),
  };
  const subtotal = subtotalByTaxRate["0.08"] + subtotalByTaxRate["0.10"];
  const shippingFee = Number(q.shippingFee||0);
  const taxExcludedTotal = subtotal + shippingFee;
  const taxTotal = taxByTaxRate["0.08"] + taxByTaxRate["0.10"];
  const taxIncludedTotal = taxExcludedTotal + taxTotal;
  return {subtotalByTaxRate, taxByTaxRate, subtotal, shippingFee, taxExcludedTotal, taxTotal, taxIncludedTotal};
}

// ---- 見積明細の金額(qty*salePrice - discountAmount)を再計算する。TransactionModalのrecompute()と同じ考え方。 ----
function recomputeQuotationItems(items) {
  return (items||[]).map(it => ({
    ...it,
    amount: Number(it.qty||0)*Number(it.salePrice||0) - Number(it.discountAmount||0),
  }));
}

// ================================================================
// ---- 出荷No.採番: SHP-YYYYMMDD-NNN (取引番号の採番方式に倣う) ----
function genShipmentNo(shipments, dateStr) {
  const ymd = (dateStr || today()).replace(/-/g,"");
  const prefix = `SHP-${ymd}-`;
  let maxSeq = 0;
  (shipments||[]).forEach(s => {
    if (s.shipmentNo && s.shipmentNo.startsWith(prefix)) {
      const n = parseInt(s.shipmentNo.slice(prefix.length), 10);
      if (!isNaN(n) && n > maxSeq) maxSeq = n;
    }
  });
  return `${prefix}${String(maxSeq+1).padStart(3,"0")}`;
}

// ---- 明細ごとの出荷/納品/返品数量を、その取引に紐づく取消以外の全shipments[]から合算して再計算する。----
// 増分方式(incrementally +=)ではなく毎回ゼロから合算し直すことで、二重計上/計上漏れのズレを防ぐ。
// cancelledQty(手動取消数量)はshipments由来ではないためここでは触らず、既存値をそのまま維持する。
function recomputeItemQtysFromShipments(transaction, allShipments) {
  const relevant = (allShipments||[]).filter(s => s.transactionId===transaction.id && s.status!=="cancelled");
  const items = (transaction.items||[]).map(it => {
    let shippedQty=0, deliveredQty=0, returnedQty=0;
    relevant.forEach(s=>{
      (s.items||[]).forEach(si=>{
        if (si.transactionItemId===it.id) {
          shippedQty += Number(si.shippedQty)||0;
          deliveredQty += Number(si.deliveredQty)||0;
          returnedQty += Number(si.returnedQty)||0;
        }
      });
    });
    return {...it, shippedQty, deliveredQty, returnedQty};
  });
  return {...transaction, items};
}

// ---- 明細1件の表示用の出荷/納品状態(保存はせず、常にqty系フィールドから都度算出する) ----
function itemDeliveryStatus(it) {
  const qty = Number(it.qty)||0;
  const shipped = Number(it.shippedQty)||0;
  const delivered = Number(it.deliveredQty)||0;
  const returned = Number(it.returnedQty)||0;
  const cancelled = Number(it.cancelledQty)||0;
  const shippable = qty - cancelled;
  if (returned > 0 && delivered + returned >= qty && qty > 0) return "返品済み";
  if (returned > 0) return "一部返品";
  if (delivered >= qty && qty > 0) return "納品済み";
  if (delivered > 0) return "一部納品";
  if (shippable > 0 && shipped >= shippable) return "出荷済み";
  if (shipped > 0) return "一部出荷";
  return "未出荷";
}

// ---- 取引ヘッダのstatusを明細のqty系フィールドから導出する。cancelledはここでは変化させない。----
// 全明細が「納品済+返品済で受注数量を満たす」場合のみdelivered。一部でも進捗があればpartial_delivered。
// 加えて全明細が請求済(invoicedQty>=deliveredQty)まで到達していればinvoicedとする。
function computeTxStatus(t) {
  if (t.status === "cancelled") return "cancelled";
  const items = t.items || [];
  if (!items.length) return t.status || "created";
  const allAccounted = items.every(it => Number(it.deliveredQty||0)+Number(it.returnedQty||0) >= Number(it.qty||0));
  const allInvoiced = items.every(it => Number(it.invoicedQty||0) >= Number(it.deliveredQty||0));
  const anyInvoiced = items.some(it => Number(it.invoicedQty||0) > 0);
  if (allAccounted && allInvoiced && anyInvoiced) return "invoiced";
  if (allAccounted) return "delivered";
  const anyProgress = items.some(it => Number(it.shippedQty||0)>0 || Number(it.deliveredQty||0)>0 || Number(it.returnedQty||0)>0);
  if (anyProgress) return "partial_delivered";
  return "created";
}

// ---- 取引先の締め日設定(月末 or N日締め)から、対象月(targetMonth "YYYY-MM")の請求対象期間を算出する。----
// 境界は開始/終了とも含む(inclusive-inclusive)。N日締めの場合、前月(N+1)日〜当月N日となる。
// 月によって日数が異なる場合(closingDayが月の日数を超える場合)は月末日にクランプする。
function billingPeriodFor(partner, targetMonth) {
  const [y,m] = targetMonth.split("-").map(Number); // m: 1始まり
  const closingDay = partner?.closingDay;
  const daysInMonth = (yy,mm) => new Date(yy, mm, 0).getDate(); // mm: 1始まり
  let py=y, pm=m-1; if (pm<1){pm=12;py=y-1;}
  let endDay, prevEndDay;
  if (closingDay === "月末" || closingDay==null || closingDay==="") {
    endDay = daysInMonth(y,m);
    prevEndDay = daysInMonth(py,pm);
  } else {
    const n = Number(closingDay);
    endDay = Math.min(n, daysInMonth(y,m));
    prevEndDay = Math.min(n, daysInMonth(py,pm));
  }
  const end = `${y}-${String(m).padStart(2,"0")}-${String(endDay).padStart(2,"0")}`;
  const prevEndObj = new Date(py, pm-1, prevEndDay);
  prevEndObj.setDate(prevEndObj.getDate()+1);
  const start = `${prevEndObj.getFullYear()}-${String(prevEndObj.getMonth()+1).padStart(2,"0")}-${String(prevEndObj.getDate()).padStart(2,"0")}`;
  return {start, end};
}

// ---- 取引tが取引先partnerの対象月targetMonthの請求対象期間に入るか(請求基準日ベース) ----
function inBillingPeriod(t, partner, targetMonth) {
  const basis = partner?.invoiceBasis || "delivery";
  const dateStr = invoiceBasisDate(t, basis);
  if (!dateStr) return false;
  // 都度請求(分納ごと): 期間で絞り込まず、未請求の納品済数量が存在すれば常に対象とする
  if (partner?.billingCadence === "perShipment") return true;
  const {start,end} = billingPeriodFor(partner, targetMonth);
  return dateStr >= start && dateStr <= end;
}

// ---- 取引先の請求サイクル設定に基づき、取引tの明細のうち今回請求可能な数量を持つものだけを抽出する。----
// afterFullDelivery: 全明細が「納品済+返品済で受注数量を満たす」までは一切請求対象にしない(従来のstatus==="delivered"全量請求と同じ挙動)。
// perShipment: 明細単位で「納品済数量−請求済数量」が1以上あれば、取引全体の納品完了を待たずに対象とする。
// いずれの場合も請求可能数量は必ず (deliveredQty - invoicedQty) を0未満にならないようクランプした値であり、
// 既に請求済の数量を再度対象に含めることは構造的にできない(invoicedQtyがdeliveredQtyを上回ることはない=下記の発行処理を参照)。
function billableItemsFor(t, partner) {
  const items = t.items || [];
  const cadence = partner?.billingCadence || "afterFullDelivery";
  const fullyDelivered = items.length>0 && items.every(it => Number(it.deliveredQty||0)+Number(it.returnedQty||0) >= Number(it.qty||0));
  if (cadence === "afterFullDelivery" && !fullyDelivered) return [];
  return items
    .map(it => ({...it, billableQty: Math.max(0, Number(it.deliveredQty||0) - Number(it.invoicedQty||0))}))
    .filter(it => it.billableQty > 0);
}

// 1エンティティ配列を比較し、新規追加または内容変化があったレコードだけを返す純粋関数(単体テスト用に分離)
function diffEntityRecords(prevArr, nextArr){
  const prevMap = new Map((prevArr||[]).map(r => [r.id, r]));
  return (nextArr||[]).filter(r => {
    const before = prevMap.get(r.id);
    return !before || JSON.stringify(before) !== JSON.stringify(r);
  });
}
// prevArrにはあるがnextArrに無くなったid(=物理削除されたレコード)を返す純粋関数(単体テスト用に分離)
function diffRemovedIds(prevArr, nextArr){
  const nextIds = new Set((nextArr||[]).map(r => r.id));
  return (prevArr||[]).map(r => r.id).filter(id => !nextIds.has(id));
}
// metaオブジェクトを比較し、変化したキーのみ返す純粋関数(単体テスト用に分離)
function diffMetaKeys(prevMeta, nextMeta){
  const pm = prevMeta||{}, nm = nextMeta||{};
  return Object.keys(nm).filter(k => JSON.stringify(pm[k]) !== JSON.stringify(nm[k]));
}
// prevData→nextDataの差分だけをバックエンドへpushする。呼び出し元でawaitせずfire-and-forgetする想定。
// 失敗しても例外を投げない(ローカル保存は既に成功しているため、ユーザー操作を止めない)。
async function pushDiffToBackend(config, prevData, nextData){
  if (!config || !config.enabled || !config.url) return;
  for (const entity of BACKEND_ENTITIES) {
    const prevArr = prevData && prevData[entity], nextArr = nextData && nextData[entity];
    const changed = diffEntityRecords(prevArr, nextArr);
    for (const rec of changed) { await backendPush(config, entity, rec); }
    // 物理削除(配列から丸ごと消えたレコード)もスプレッドシート側から削除する。
    // これをしないと、削除したはずのレコードが次回pull時にサーバー側の残存データで復活してしまう。
    const removedIds = diffRemovedIds(prevArr, nextArr);
    for (const id of removedIds) { await backendDelete(config, entity, id); }
  }
  const changedMetaKeys = diffMetaKeys(prevData && prevData.meta, nextData && nextData.meta);
  for (const k of changedMetaKeys) { await backendPushMeta(config, k, nextData.meta[k]); }
}

// Phase D: 帳票印刷(見積書/発注書/納品書) 共通ヘルパー
// ================================================================
// ---- 発注書番号採番: PO-YYYYMMDD-NNN (取引番号/出荷番号の採番方式に倣い、日付内でグローバル連番) ----
// documents[]全体からdocumentType==="purchase_order"のdocumentNoだけを見て連番を決める
// (取消・削除された番号も再利用しない=常に既存の最大連番+1)。
function genPurchaseOrderNo(documents, dateStr) {
  const ymd = (dateStr || today()).replace(/-/g,"");
  const prefix = `PO-${ymd}-`;
  let maxSeq = 0;
  (documents||[]).forEach(doc => {
    if (doc.documentType==="purchase_order" && doc.documentNo && doc.documentNo.startsWith(prefix)) {
      const n = parseInt(doc.documentNo.slice(prefix.length), 10);
      if (!isNaN(n) && n > maxSeq) maxSeq = n;
    }
  });
  return `${prefix}${String(maxSeq+1).padStart(3,"0")}`;
}

// ---- 発行時点の自社情報スナップショット(meta.companySettingsのコピー。後から設定を変えても過去の帳票には影響しない) ----
function buildCompanySnapshot(data) {
  const cs = (data.meta && data.meta.companySettings) || {};
  return {
    companyName: cs.companyName||"", companyZip: cs.companyZip||"", companyAddress: cs.companyAddress||"",
    companyTel: cs.companyTel||"", companyFax: cs.companyFax||"", companyEmail: cs.companyEmail||"",
    invoiceRegistrationNumber: cs.invoiceRegistrationNumber||"",
    bankName: cs.bankName||"", bankBranch: cs.bankBranch||"", bankAccountType: cs.bankAccountType||"",
    bankAccountNumber: cs.bankAccountNumber||"", bankAccountHolder: cs.bankAccountHolder||"",
    companyLogo: cs.companyLogo||"", representativeName: cs.representativeName||"", documentNote: cs.documentNote||"",
  };
}
function buildPartnerSnapshot(partner) {
  if (!partner) return null;
  return {
    id: partner.id, name: partner.name||"", formalName: partner.formalName||"",
    zip: partner.zip||"", address: partner.address||"", tel: partner.tel||"",
    email: partner.email||"", registrationNumber: partner.registrationNumber||"",
  };
}
function buildDeliveryDestSnapshot(dest, partner) {
  if (!dest) return null;
  return {
    id: dest.id, name: dest.name||"",
    address: dest.usePartnerAddress ? (partner?.address||"") : [dest.zip,dest.prefecture,dest.city,dest.addressLine].filter(Boolean).join(" "),
    tel: dest.usePartnerAddress ? (partner?.tel||"") : (dest.tel||""),
    personInCharge: dest.personInCharge||"", deliveryNotes: dest.deliveryNotes||"",
  };
}

// ---- 見積書スナップショット構築(computeQuotationTotalsと同じ税率別集計ロジックを流用) ----
function buildQuotationSnapshot(q, data) {
  const customer = data.partners.find(p=>p.id===q.customerId);
  const billingPartner = data.partners.find(p=>p.id===q.billingPartnerId) || customer;
  const dest = (data.deliveryDestinations||[]).find(dd=>dd.id===q.deliveryDestinationId);
  const totals = computeQuotationTotals(q, data.products);
  const items = (q.items||[]).map(it => {
    const p = data.products.find(x=>x.id===it.productId);
    return {
      productName: p?.name || "?", unit: it.unit || p?.unit || "",
      qty: Number(it.qty)||0, unitPrice: Number(it.salePrice)||0,
      taxRate: Number(it.taxRate)===0.08 ? 0.08 : 0.10,
      discountAmount: Number(it.discountAmount)||0, amount: Number(it.amount)||0,
      note: it.note||"",
    };
  });
  return {
    company: buildCompanySnapshot(data),
    customer: buildPartnerSnapshot(customer),
    billingPartner: buildPartnerSnapshot(billingPartner),
    deliveryDestination: buildDeliveryDestSnapshot(dest, customer),
    addressee: q.addressee||"", personInCharge: q.personInCharge||"", subject: q.subject||"",
    quotationNo: q.quotationNo, quotationDate: q.quotationDate, expiryDate: q.expiryDate||"",
    deliveryDeadline: q.deliveryDeadline||"", paymentTerms: q.paymentTerms||"", shippingMethod: q.shippingMethod||"",
    items, totals, note: q.note||"", staffName: q.staffName||"",
  };
}

// ---- 発注書スナップショット構築(仕入先1社分)。取引の明細のうち、その仕入先(明細ごとのsupplierId優先、
// 無ければ取引全体のsupplierId)に紐づく明細だけを抽出する。1取引に複数仕入先がいれば呼び出し側が
// 仕入先ごとに本関数を複数回呼び、documents[]に1件ずつ登録する。 ----
function buildPurchaseOrderSnapshot(tx, supplierId, data, documentNo) {
  const supplier = data.partners.find(p=>p.id===supplierId);
  const customer = data.partners.find(p=>p.id===tx.customerId);
  const dest = (data.deliveryDestinations||[]).find(dd=>dd.id===tx.deliveryDestinationId);
  const items = (tx.items||[]).filter(it => (it.supplierId||tx.supplierId)===supplierId).map(it => {
    const p = data.products.find(x=>x.id===it.productId);
    const amount = Number(it.qty||0)*Number(it.purchasePrice||0);
    return {
      productName: p?.name||"?", unit: p?.unit||"", qty: Number(it.qty)||0,
      purchasePrice: Number(it.purchasePrice)||0, amount,
      taxRate: p?.taxRate===0.08 ? 0.08 : 0.10, note: it.note||"",
    };
  });
  const subtotalByTaxRate = {"0.08":0, "0.10":0};
  items.forEach(it => { subtotalByTaxRate[it.taxRate.toFixed(2)] += it.amount; });
  const taxByTaxRate = {
    "0.08": Math.floor(subtotalByTaxRate["0.08"]*0.08),
    "0.10": Math.floor(subtotalByTaxRate["0.10"]*0.10),
  };
  const subtotal = subtotalByTaxRate["0.08"] + subtotalByTaxRate["0.10"];
  const taxTotal = taxByTaxRate["0.08"] + taxByTaxRate["0.10"];
  return {
    company: buildCompanySnapshot(data),
    supplier: buildPartnerSnapshot(supplier), supplierId,
    deliveryDestination: buildDeliveryDestSnapshot(dest, customer),
    purchaseOrderNo: documentNo, purchaseOrderDate: today(),
    desiredDeliveryDate: tx.plannedDeliveryDate||"", transactionNo: tx.transactionNo,
    items, subtotalByTaxRate, taxByTaxRate, subtotal, taxTotal, total: subtotal+taxTotal,
    note: tx.note||"",
  };
}

// ---- 納品書スナップショット構築。取引の受注数量ではなく、対象shipmentレコードの各明細deliveredQty
// (=分納ならその回に実際に納品した数量)だけを使う。単価は元取引明細の受注単価(凍結)を引用する。 ----
function buildDeliveryNoteSnapshot(shipment, tx, data) {
  const customer = data.partners.find(p=>p.id===tx.customerId);
  const dest = (data.deliveryDestinations||[]).find(dd=>dd.id===(shipment.deliveryDestinationId||tx.deliveryDestinationId));
  const items = (shipment.items||[]).filter(si=>Number(si.deliveredQty)>0).map(si => {
    const txItem = (tx.items||[]).find(it=>it.id===si.transactionItemId);
    const p = data.products.find(x=>x.id===si.productId);
    const unitPrice = Number(txItem?.salePrice)||0;
    const qty = Number(si.deliveredQty)||0;
    return {
      productName: p?.name||"?", unit: p?.unit||"", qty, unitPrice, amount: qty*unitPrice,
      taxRate: p?.taxRate===0.08 ? 0.08 : 0.10,
    };
  });
  const subtotalByTaxRate = {"0.08":0, "0.10":0};
  items.forEach(it => { subtotalByTaxRate[it.taxRate.toFixed(2)] += it.amount; });
  const taxByTaxRate = {
    "0.08": Math.floor(subtotalByTaxRate["0.08"]*0.08),
    "0.10": Math.floor(subtotalByTaxRate["0.10"]*0.10),
  };
  const subtotal = subtotalByTaxRate["0.08"] + subtotalByTaxRate["0.10"];
  const taxTotal = taxByTaxRate["0.08"] + taxByTaxRate["0.10"];
  return {
    company: buildCompanySnapshot(data),
    customer: buildPartnerSnapshot(customer),
    deliveryDestination: buildDeliveryDestSnapshot(dest, customer),
    deliveryNoteNo: shipment.shipmentNo, deliveryDate: shipment.actualDeliveryDate||shipment.shipmentDate,
    sourceTransactionNo: tx.transactionNo,
    items, subtotalByTaxRate, taxByTaxRate, subtotal, taxTotal, total: subtotal+taxTotal,
    note: shipment.note||"",
  };
}

// ---- documents[]の中から、指定の帳票種別+発行元IDに紐づく未取消の帳票を探す(発注書のように同一sourceIdで
// 複数件あり得る場合はextraMatchで絞り込む)。見つかればそれを再利用し、新しいスナップショットは作らない
// (=発行後にマスタ/住所が変わっても過去に発行した帳票の内容は変わらない、という仕様上の要件を満たす)。----
function findExistingDocument(documents, documentType, sourceId, extraMatch) {
  return (documents||[]).find(x =>
    x.documentType===documentType && x.sourceId===sourceId && !x.cancelled && (!extraMatch || extraMatch(x))
  ) || null;
}

// ---- 帳票の準備: 既存の未取消帳票があればそれをそのまま返し(内容凍結)、無ければ新規のdocumentオブジェクトを
// 組み立てて返す(この時点ではまだdata.documentsへは追加しない。呼び出し側がisNew===trueのときだけ
// update()内でcommitDocumentIssue()を呼んで保存する)。 ----
function prepareDocument(data, {documentType, sourceId, documentNo, buildSnapshot, extraMatch}) {
  const existing = findExistingDocument(data.documents, documentType, sourceId, extraMatch);
  if (existing) return {doc: existing, isNew:false};
  const now = new Date().toISOString();
  const doc = {
    id: newId("doc"), documentNo, documentType, issuedAt: now,
    issuedBy: data.meta?.currentUserName||"", sourceId,
    snapshot: buildSnapshot(),
    reissueCount: 0, reissuedAt: [], cancelled: false, cancelReason: null,
  };
  return {doc, isNew:true};
}
// ---- 新規発行の帳票をdata.documentsへ確定登録し、監査ログに記録する ----
function commitDocumentIssue(d, doc, reason) {
  d.documents = [...(d.documents||[]), doc];
  d = addAuditLog(d, {action:"document_issue", targetType:"document", targetId:doc.id, before:null, after:doc, reason: reason||""});
  return d;
}
// ---- 再発行: 新しいdocuments[]レコードは作らず、同一レコードのreissueCount/reissuedAtだけを更新する
// (spec要件: 再発行は全く同じ凍結済みsnapshotを表示するだけ)。 ----
function reissueDocumentInData(d, docId) {
  d.documents = d.documents || [];
  const before = d.documents.find(x=>x.id===docId);
  if (!before) return d;
  const list = Array.isArray(before.reissuedAt) ? before.reissuedAt : [];
  const after = {...before, reissueCount:(before.reissueCount||0)+1, reissuedAt:[...list, new Date().toISOString()]};
  d.documents = d.documents.map(x=>x.id===docId?after:x);
  d = addAuditLog(d, {action:"document_reissue", targetType:"document", targetId:docId, before, after});
  return d;
}

  // pullFromBackendが取得中にローカル編集が発生した場合、pull結果で上書きしないためのカウンタ
  const updateSeqRef = React.useRef(0);

  // fn(data)=>newData を実行して保存する。第2引数logMetaを渡すと監査ログ(auditLog)に自動記録する。
  const update = async (fn, logMeta) => {
    updateSeqRef.current++;
    // fnはd.products.push(...)のように配列を直接mutateすることがあるため、{...data}の浅いコピーでは
    // prevDataがfn実行後の内容と同じ配列を参照してしまう(=差分検出が常に「変更なし」になる)。
    // 共有データベースへの差分pushを正しく行うため、JSONで完全に独立したスナップショットを取る。
    const prevData = JSON.parse(JSON.stringify(data));
    let nd = fn({...data});
    if (logMeta) nd = addAuditLog(nd, logMeta);
    saveData(nd);setData(nd);
    if (syncHandle){const ok=await writeSyncFile(syncHandle,nd);showToast(ok?"自動同期保存":"同期失敗");}
    else {showToast("保存しました");}
    // 共有データベースが有効なら差分だけ非同期でpushする(fire-and-forget。失敗してもローカル保存は既に成功済み)
    if (backendConfig.enabled && backendConfig.url) {
      pushDiffToBackend(backendConfig, prevData, nd)
        .then(()=>setLastSyncTime(new Date()))

  const pullFromBackend = async () => {

  const stats = useMemo(()=>{
    const txs = data.transactions || [];
    let totalSale = 0, totalPurchase = 0;
    const byCat = {"肥料":{sale:0,purchase:0},"農薬":{sale:0,purchase:0},"資材":{sale:0,purchase:0}};
    const byCust = {};
    const bySup = {};
    txs.forEach(t => {
      totalSale += t.totalSaleAmount || 0;
      totalPurchase += t.totalPurchaseAmount || 0;
      byCust[t.customerId] = (byCust[t.customerId]||0) + (t.totalSaleAmount||0);
      if (t.supplierId) bySup[t.supplierId] = (bySup[t.supplierId]||0) + (t.totalPurchaseAmount||0);
      (t.items||[]).forEach(it => {
        const p = data.products.find(x=>x.id===it.productId);
        if (p && byCat[p.category]) {
          byCat[p.category].sale += (it.saleAmount||0);
          byCat[p.category].purchase += (it.purchaseAmount||0);
        }
      });
    });
    return {totalSale, totalPurchase, gross: totalSale-totalPurchase, byCat, byCust, bySup};
  },[data]);
  const rate = stats.totalSale>0 ? (stats.gross/stats.totalSale*100).toFixed(1) : 0;

  const txs = data.transactions || [];
  const invoiced = txs.filter(t=>t.status==="invoiced").length;
  const delivered = txs.filter(t=>t.status==="delivered").length;
  const partialDelivered = txs.filter(t=>t.status==="partial_delivered").length;
  const created = txs.filter(t=>t.status==="created").length;

  return (<>
    <div className="card">
      <h2>全体サマリー(今期)</h2>
      <div className="grid-4">
        <div className="stat"><div className="value">{yen(stats.totalSale)}</div><div className="label">受注合計(税抜)</div></div>
        <div className="stat"><div className="value">{yen(stats.totalPurchase)}</div><div className="label">発注合計(税抜)</div></div>
        <div className="stat"><div className="value">{yen(stats.gross)}</div><div className="label">粗利</div></div>
        <div className="stat"><div className="value">{rate}%</div><div className="label">粗利率</div></div>
      </div>
    </div>
    <div className="card">
      <h2>ステータス</h2>
      <div className="grid-4" style={{gridTemplateColumns:"repeat(5,1fr)"}}>
        <div className="stat"><div className="value">{created}</div><div className="label">請求書作成済</div></div>
        <div className="stat"><div className="value">{partialDelivered}</div><div className="label">一部納品</div></div>
        <div className="stat"><div className="value">{delivered}</div><div className="label">納品✓済</div></div>
        <div className="stat"><div className="value">{invoiced}</div><div className="label">freee請求書発行済</div></div>
        <div className="stat"><div className="value">{txs.length}</div><div className="label">取引合計</div></div>
      </div>
    </div>
    <div className="card">
      <h2>カテゴリ別収支</h2>
      <table>
        <thead><tr><th>カテゴリ</th><th className="text-right">受注</th><th className="text-right">発注</th><th className="text-right">粗利</th><th className="text-right">粗利率</th></tr></thead>
        <tbody>
          {Object.keys(stats.byCat).map(k=>{
            const c = stats.byCat[k]; const g = c.sale - c.purchase; const r = c.sale>0?(g/c.sale*100).toFixed(1):0;
            return <tr key={k}><td><span className={"badge "+(k==="農薬"?"badge-nouyaku":"badge-hiryou")}>{k}</span></td>
              <td className="text-right price">{yen(c.sale)}</td>
              <td className="text-right price">{yen(c.purchase)}</td>
              <td className={"text-right "+(g>=0?"profit":"loss")}>{yen(g)}</td>
              <td className="text-right">{r}%</td></tr>;
          })}
        </tbody>
      </table>
    </div>
    <div className="grid-2">
      <div className="card">
        <h2>お客様別 受注</h2>
        <table>
          <thead><tr><th>お客様</th><th className="text-right">受注</th></tr></thead>
          <tbody>
            {Object.keys(stats.byCust).sort((a,b)=>stats.byCust[b]-stats.byCust[a]).slice(0,10).map(id=>{
              const p = data.partners.find(x=>x.id===id);
              return <tr key={id}><td>{p?.name||id}</td><td className="text-right price">{yen(stats.byCust[id])}</td></tr>;
            })}

      </div>
      <div className="card">
        <h2>メーカー別 発注</h2>

            {Object.keys(stats.bySup).sort((a,b)=>stats.bySup[b]-stats.bySup[a]).slice(0,10).map(id=>{
              const p = data.partners.find(x=>x.id===id);
              return <tr key={id}><td>{p?.name||id}</td><td className="text-right price">{yen(stats.bySup[id])}</td></tr>;
